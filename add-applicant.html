<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Applicant - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f4f4; }
        .form-wrapper { max-width: 650px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .card { background: #ffffff; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-top: 5px solid #7A1C1C; }
        .card h2 { color: #222; font-size: 1.5rem; margin-bottom: 25px; text-transform: uppercase; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 0.95rem; }
        .form-group input, .form-group select { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; background: #fff; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus { border-color: #7A1C1C; }
        .btn-save { width: 100%; padding: 12px; background-color: #16a34a; color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 15px; }
        .btn-save:hover { background-color: #15803d; }
    </style>
</head>
<body>

    <div class="form-wrapper">
        <a href="waiting-lists.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Waiting Lists</a>

        <div class="card">
            <h2>Add New Applicant</h2>
            
            <form onsubmit="saveApplicant(event)">
                <div class="form-group">
                    <label>NIC Number</label>
                    <input type="text" id="nic" placeholder="Enter NIC" required>
                </div>

                <div class="form-group">
                    <label>Computer Number</label>
                    <input type="text" id="computerNo" placeholder="Enter Computer Number" required>
                </div>

                <div class="form-group">
                    <label>Applicant's Name</label>
                    <input type="text" id="fullName" placeholder="Enter Full Name" required>
                </div>

                <div class="form-group">
                    <label>Designation</label>
                    <input type="text" id="designation" placeholder="Enter Designation" required>
                </div>

                <div class="form-group">
                    <label>Housing Type</label>
                    <input type="text" id="housingType" placeholder="Enter Housing Type" required>
                </div>

                <div class="form-group">
                    <label>Workplace</label>
                    <input type="text" id="workplace" placeholder="Enter Workplace" required>
                </div>

                <div class="form-group">
                    <label>Allocated Date</label>
                    <input type="date" id="allocatedDate" required>
                </div>

                <div class="form-group">
                    <label>Allocated House Type</label>
                    <input type="text" id="allocatedHouseType" placeholder="Enter Allocated House Type" required>
                </div>

                <div class="form-group">
                    <label>Other</label>
                    <input type="text" id="other" placeholder="Any remarks">
                </div>

                <button type="submit" class="btn-save"><i class="fa-solid fa-user-plus"></i> Save Applicant</button>
            </form>
        </div>
    </div>

    <script>
        function saveApplicant(event) {
            event.preventDefault();
            
            // URL එකෙන් අදාළ ලැයිස්තුව (List Type) ලබා ගැනීම (උදා: general, guard ආදී වශයෙන්)
            const urlParams = new URLSearchParams(window.location.search);
            const listType = urlParams.get('list') || 'general';

            alert("Applicant added successfully to the " + listType + " list!");
            window.location.href = "waiting-lists.html";
        }
    </script>

</body>
</html>
