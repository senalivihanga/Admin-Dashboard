<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarters List - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container { max-width: 1750px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .page-title { text-align: center; color: #7A1C1C; font-size: 2rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 8px; }
        
        .section-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .search-box-wrapper { position: relative; display: flex; align-items: center; }
        .search-box-wrapper i { position: absolute; left: 14px; color: #64748b; font-size: 0.9rem; }
        .search-input { padding: 10px 14px 10px 40px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; width: 300px; outline: none; transition: all 0.2s; background-color: #ffffff; }
        .search-input:focus { border-color: #7A1C1C; box-shadow: 0 0 0 3px rgba(122, 28, 28, 0.1); }

        .btn-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .maint-page-btn { background-color: #2563eb; color: white; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.875rem; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; }
        .maint-page-btn:hover { background-color: #1d4ed8; }
        .btn-print { background-color: #0284c7; color: #ffffff; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.875rem; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; }
        .btn-print:hover { background-color: #0369a1; }

        .table-card { background: transparent; padding: 0; border-radius: 0; box-shadow: none; border: none; overflow-x: auto; position: relative; }
        .table-responsive { width: 100%; overflow-x: auto; background: #ffffff; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .quarters-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1300px; }
        
        .quarters-table th, .quarters-table td { 
            padding: 14px 12px; 
            border-bottom: 1px solid #e2e8f0; 
            vertical-align: middle; 
            font-size: 0.85rem; 
            text-align: center; 
        }
        
        .quarters-table th { background-color: #7A1C1C; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        .quarters-table td { color: #4b5563; font-weight: normal; }
        .quarters-table tbody tr { transition: background-color 0.15s ease; }
        .quarters-table tbody tr:hover { background-color: #f1f5f9; }
        
        .facility-container { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-active { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-inactive { background-color: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

        .action-cell { display: flex; justify-content: center; align-items: center; gap: 6px; }
        .action-btn { border: none; width: 32px; height: 32px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s; }
        .btn-view { background-color: #0ea5e9; color: white; }
        .btn-view:hover { background-color: #0284c7; }
        .btn-edit { background-color: #f59e0b; color: white; }
        .btn-edit:hover { background-color: #d97706; }
        .btn-delete { background-color: #dc2626; color: white; }
        .btn-delete:hover { background-color: #b91c1c; }
        
        .custom-msg-box { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .msg-content { background: white; padding: 25px; border-radius: 10px; text-align: center; width: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .msg-content p { margin-bottom: 20px; font-size: 1rem; color: #334155; font-weight: 600; }
        .msg-btns { display: flex; justify-content: center; gap: 10px; }
        .msg-btn { padding: 8px 15px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
        .msg-btn-yes { background-color: #dc2626; color: white; }
        .msg-btn-no { background-color: #64748b; color: white; }

        .view-modal-content { background: white; padding: 30px; border-radius: 12px; width: 500px; max-width: 90%; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .view-modal-content h3 { color: #7A1C1C; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .view-row { display: flex; margin-bottom: 10px; font-size: 0.9rem; }
        .view-label { font-weight: 700; width: 160px; color: #475569; }
        .view-value { color: #1e293b; flex: 1; }
        .close-view-btn { background-color: #7A1C1C; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 15px; display: block; width: 100%; }

        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background-color: #ffffff; color: #000000; font-size: 9pt; }
            .container { max-width: 100%; margin: 0; padding: 0; }
            .back-link, .section-header-bar, .action-cell, th:last-child, td:last-child { display: none !important; }
            .page-title { font-size: 1.3rem; margin-bottom: 10px; color: #000000; text-decoration: underline; }
            .table-responsive { overflow: visible !important; width: 100%; box-shadow: none !important; border: none !important; background: transparent !important; }
            .quarters-table { width: 100% !important; min-width: 100% !important; font-size: 8.5pt; border: 1px solid #000000; table-layout: fixed; }
            .quarters-table th, .quarters-table td { border: 1px solid #000000; padding: 6px 4px; color: #000000; font-weight: normal; text-align: center; word-wrap: break-word; }
            .quarters-table th { background-color: #f0f0f0 !important; color: #000000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="SC.html" class="back-link" id="backLink"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h2 class="page-title">Quarters Details</h2>

        <div class="section-header-bar">
            <!-- Search bar -->
            <div class="search-box-wrapper">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by Quarter No, Name, Location..." onkeyup="searchTable()">
            </div>

            <!-- Action buttons: Maintenance Page & Print -->
            <div class="btn-group" id="actionBtnGroup">
                <a href="maintenance.html" class="maint-page-btn" id="maintBtn"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance Page</a>
                <button onclick="window.print()" class="btn-print" id="printBtn">
                    <i class="fa-solid fa-print"></i> Print / Save as PDF
                </button>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="quarters-table" id="quartersTable">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Quarter No.</th>
                            <th>Quarter Location</th>
                            <th>Quarter Name</th>
                            <th>Address</th>
                            <th>Quarter Type</th>
                            <th>Assessment Rent (LKR)</th>
                            <th>Status</th>
                            <th>Facility (Electricity & Water)</th>
                            <th id="actionTh">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="quartersBody">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- View Details Modal -->
    <div class="custom-msg-box" id="viewModal">
        <div class="view-modal-content">
            <h3>Quarter Detailed View</h3>
            <div id="viewModalBody"></div>
            <button class="close-view-btn" onclick="closeViewModal()">Close</button>
        </div>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div class="custom-msg-box" id="deleteModal">
        <div class="msg-content">
            <p><i class="fa-solid fa-triangle-exclamation" style="color: #dc2626; font-size: 1.5rem; margin-bottom: 10px; display:block;"></i> Are you sure you want to delete this quarter record?</p>
            <div class="msg-btns">
                <button class="msg-btn msg-btn-yes" id="confirmDeleteBtn">Yes, Delete</button>
                <button class="msg-btn msg-btn-no" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userRole = urlParams.get('role');

        window.addEventListener('DOMContentLoaded', () => { 
            applyRolePermissions();
            loadTableData(); 
        });

        function applyRolePermissions() {
            const printBtn = document.getElementById('printBtn');
            const maintBtn = document.getElementById('maintBtn');
            const backLink = document.getElementById('backLink');

            if (userRole === 'bo' || userRole === 'BO') {
                // Branch Officer: Hide Print button, Keep Maintenance Page, back link to BO.html
                if(printBtn) printBtn.style.setProperty('display', 'none', 'important');
                if(maintBtn) maintBtn.style.display = 'inline-flex';
                if(backLink) backLink.href = 'BO.html';
            } else if (userRole === 'sc' || userRole === 'SC') {
                // Subject Clerk: Show Maintenance Page and Print, back link to SC.html
                if(maintBtn) maintBtn.style.display = 'inline-flex';
                if(printBtn) printBtn.style.display = 'inline-flex';
                if(backLink) backLink.href = 'SC.html';
            } else {
                // Default / Admin View
                if(maintBtn) maintBtn.style.display = 'inline-flex';
                if(printBtn) printBtn.style.display = 'inline-flex';
            }
        }

        const defaultData = [
            {
                quarterNum: "Q-01",
                location: "Colombo",
                quarterName: "Bungalow A",
                address: "No. 12, Railway Avenue, Colombo 10",
                quarterType: "Bungalows",
                assessmentRent: "5,500.00",
                status: "Under Maintenance",
                electric: true,
                water: true,
                lastMaint: "2025-05-12"
            }
        ];

        function getStoredData() {
            const data = localStorage.getItem('quartersData');
            return data ? JSON.parse(data) : defaultData;
        }

        function saveStoredData(data) {
            localStorage.setItem('quartersData', JSON.stringify(data));
        }

        function loadTableData() {
            const tbody = document.getElementById('quartersBody');
            tbody.innerHTML = '';
            const data = getStoredData();

            data.forEach((item, index) => {
                const electricBadge = item.electric ? `<span class="badge badge-active"><i class="fa-solid fa-bolt"></i></span>` : `<span class="badge badge-inactive"><i class="fa-solid fa-bolt"></i></span>`;
                const waterBadge = item.water ? `<span class="badge badge-active"><i class="fa-solid fa-droplet"></i></span>` : `<span class="badge badge-inactive"><i class="fa-solid fa-droplet"></i></span>`;

                const tr = document.createElement('tr');
                
                let actionsHtml = '';
                // Subject Clerk (SC) සහ Branch Officer (BO) සඳහා Edit සහ Delete සම්පූර්ණයෙන්ම අයින් කර View පමණක් පෙන්වයි.
                if (userRole === 'sc' || userRole === 'SC' || userRole === 'bo' || userRole === 'BO') {
                    actionsHtml = `
                        <div class="action-cell">
                            <button class="action-btn btn-view" onclick="openViewModal(${index})" title="View Details"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    `;
                } else {
                    // Admin හෝ සාමාන්‍ය වැටෙන පිටුවලදී View, Edit, සහ Delete සියල්ලම පෙන්වයි.
                    actionsHtml = `
                        <div class="action-cell">
                            <button class="action-btn btn-view" onclick="openViewModal(${index})" title="View Details"><i class="fa-solid fa-eye"></i></button>
                            <a href="edit-quarter.html?index=${index}" class="action-btn btn-edit" title="Edit"><i class="fa-solid fa-pen-to-square"></i></a>
                            <button class="action-btn btn-delete" onclick="promptDelete(${index})" title="Delete"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }

                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><b>${item.quarterNum}</b></td>
                    <td>${item.location}</td>
                    <td>${item.quarterName || 'N/A'}</td>
                    <td>${item.address || 'N/A'}</td>
                    <td>${item.quarterType}</td>
                    <td><b>Rs. ${item.assessmentRent || '0.00'}</b></td>
                    <td>${item.status}</td>
                    <td>
                        <div class="facility-container">
                            ${electricBadge} Elec
                            ${waterBadge} Water
                        </div>
                    </td>
                    <td>${actionsHtml}</td>
                `;
                
                tbody.appendChild(tr);
            });
        }

        function searchTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const table = document.getElementById("quartersTable");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let rowMatched = false;
                const tdElements = tr[i].getElementsByTagName("td");
                
                for (let j = 0; j < tdElements.length - 1; j++) {
                    const cellText = tdElements[j].textContent || tdElements[j].innerText;
                    if (cellText.toLowerCase().indexOf(filter) > -1) {
                        rowMatched = true;
                        break;
                    }
                }

                tr[i].style.display = rowMatched ? "" : "none";
            }
        }

        function openViewModal(index) {
            const data = getStoredData();
            const item = data[index];
            if (!item) return;

            const modalBody = document.getElementById('viewModalBody');
            modalBody.innerHTML = `
                <div class="view-row"><div class="view-label">Auto ID:</div><div class="view-value">${index + 1}</div></div>
                <div class="view-row"><div class="view-label">Quarter No:</div><div class="view-value">${item.quarterNum}</div></div>
                <div class="view-row"><div class="view-label">Location:</div><div class="view-value">${item.location}</div></div>
                <div class="view-row"><div class="view-label">Quarter Name:</div><div class="view-value">${item.quarterName || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Address:</div><div class="view-value">${item.address || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Quarter Type:</div><div class="view-value">${item.quarterType}</div></div>
                <div class="view-row"><div class="view-label">Assessment Rent:</div><div class="view-value">Rs. ${item.assessmentRent || '0.00'}</div></div>
                <div class="view-row"><div class="view-label">Status:</div><div class="view-value">${item.status}</div></div>
                <div class="view-row"><div class="view-label">Electricity:</div><div class="view-value">${item.electric ? 'Available' : 'Not Available'}</div></div>
                <div class="view-row"><div class="view-label">Water:</div><div class="view-value">${item.water ? 'Available' : 'Not Available'}</div></div>
            `;
            document.getElementById('viewModal').style.display = 'flex';
        }

        function closeViewModal() { document.getElementById('viewModal').style.display = 'none'; }

        let deleteTargetIndex = null;
        function promptDelete(index) {
            deleteTargetIndex = index;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            deleteTargetIndex = null;
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            if (deleteTargetIndex !== null) {
                const data = getStoredData();
                data.splice(deleteTargetIndex, 1);
                saveStoredData(data);
                loadTableData();
                closeDeleteModal();
            }
        });
    </script>
</body>
</html>
