<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Direct Allocation - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .card { background: #ffffff; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-top: 5px solid #7A1C1C; }
        .card h2 { color: #1e293b; font-size: 1.6rem; margin-bottom: 20px; text-transform: uppercase; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.95rem; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.95rem; box-sizing: border-box; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn-submit { background-color: #059669; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; font-size: 1rem; transition: background 0.2s; }
        .btn-submit:hover { background-color: #047857; }
        #successAlert { display: none; background-color: #dcfce7; color: #166534; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; border: 1px solid #bbf7d0; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <a href="direct_allocation_FA.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Allocations List</a>

        <div class="card">
            <h2><i class="fa-solid fa-hand-holding-heart"></i> Add Direct Quarter Allocation</h2>
            
            <div id="successAlert"><i class="fa-solid fa-circle-check"></i> Direct allocation saved successfully!</div>

            <form id="addDirectAllocationForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Applicant NIC Number:</label>
                        <input type="text" id="nic" required placeholder="Enter NIC number">
                    </div>
                    <div class="form-group">
                        <label>Computer Number:</label>
                        <input type="text" id="computerNo" required placeholder="Enter computer number">
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" id="fullName" required placeholder="Enter full name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address:</label>
                        <input type="email" id="email" required placeholder="Enter email address">
                    </div>
                    <div class="form-group">
                        <label>Mobile Number:</label>
                        <input type="text" id="phone" required placeholder="Enter mobile number">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Quarter No.:</label>
                        <input type="text" id="quarterNo" required placeholder="e.g., Q-01">
                    </div>
                    <div class="form-group">
                        <label>Quarter Name:</label>
                        <input type="text" id="quarterName" required placeholder="e.g., Sunflower Manor">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Quarter Location:</label>
                        <input type="text" id="quarterLocation" required placeholder="e.g., Colombo 10">
                    </div>
                    <div class="form-group">
                        <label>Quarter Type:</label>
                        <input type="text" id="quarterType" required placeholder="e.g., Grade II">
                    </div>
                </div>

                <div class="form-group">
                    <label>Approval Authority Reason:</label>
                    <input type="text" id="reason" required placeholder="e.g., Special Service Requirement">
                </div>

                <button type="submit" class="btn-submit"><i class="fa-solid fa-check-circle"></i> Save Allocation</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('addDirectAllocationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const allocationData = {
                nic: document.getElementById('nic').value,
                computerNo: document.getElementById('computerNo').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                quarterNo: document.getElementById('quarterNo').value,
                quarterName: document.getElementById('quarterName').value,
                quarterLocation: document.getElementById('quarterLocation').value,
                quarterType: document.getElementById('quarterType').value,
                reason: document.getElementById('reason').value
            };

            let existingAllocations = JSON.parse(localStorage.getItem('directAllocations')) || [];
            existingAllocations.push(allocationData);
            localStorage.setItem('directAllocations', JSON.stringify(existingAllocations));

            const alertBox = document.getElementById('successAlert');
            alertBox.style.display = 'block';

            setTimeout(() => {
                window.location.href = "direct_allocation_FA.html";
            }, 1500);
        });
    </script>
</body>
</html>
