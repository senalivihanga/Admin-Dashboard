<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Applications Log - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .approval-container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .approval-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .approval-container h2 {
            font-size: 2rem;
            color: #7A1C1C;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: underline;
            text-underline-offset: 6px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: #7A1C1C;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .search-card {
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #e2e8f0;
        }

        .search-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            width: 300px;
            outline: none;
        }

        .search-input:focus {
            border-color: #7A1C1C;
            box-shadow: 0 0 0 3px rgba(122, 28, 28, 0.1);
        }

        .search-btn {
            background-color: #7A1C1C;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background-color: #571a1a;
        }
        .badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #fef3c7;
            color: #d97706;
        }
        .table-responsive {
            width: 100%;
            box-sizing: border-box;
            overflow-x: auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            border-top: 5px solid #7A1C1C;
        }
        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 10px;
            border: 1px solid #cbd5e1;
            vertical-align: middle;
            font-size: 0.85rem;
            overflow-wrap: anywhere;
        }

        th {
            background-color: #7A1C1C;
            color: #ffffff;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0;
        }
        tbody tr:nth-child(even) {
            background-color: #fff7f7;
        }
        tbody tr:hover {
            background-color: #f1f5f9;
        }

        @media (max-width: 640px) {
            .table-responsive {
                padding: 8px;
            }

            th, td {
                padding: 6px 3px;
                font-size: 0.68rem;
            }

            .badge {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="approval-container">
        <a href="SC.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <div class="approval-header">
            <h2>Pending Applications Log</h2>
        </div>
        <div class="search-card">
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by NIC or Name..." oninput="checkSearchClear(this)">
                <button type="button" class="search-btn" onclick="renderTable()"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </div>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Application Number</th>
                        <th>NIC</th>
                        <th>Computer Number</th>
                        <th>Name</th>
                        <th>Designation</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        const pendingData = [
            { id: 1, appNo: "SLR/AOT/2026/0006", nic: "961234567V", compNo: "115", name: "R. M. Rathnayake", desig: "Station Master", status: "Pending" },
            { id: 2, appNo: "SLR/AOT/2026/0007", nic: "934561239V", compNo: "118", name: "T. S. Wickramasinghe", desig: "Guard", status: "Pending" }
        ];

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            tbody.innerHTML = "";

            const filtered = pendingData.filter(item =>
                Object.values(item).some(value => String(value).toLowerCase().includes(searchVal))
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b; padding: 30px;">No pending records found.</td></tr>`;
                return;
            }

            filtered.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${item.appNo}</strong></td>
                        <td>${item.nic}</td>
                        <td>${item.compNo}</td>
                        <td>${item.name}</td>
                        <td>${item.desig}</td>
                        <td><span class="badge"><i class="fa-solid fa-clock" title="Pending"></i></span></td>
                    </tr>
                `;
            });
        }

        function checkSearchClear(input) {
            if (input.value.trim() === '') {
                renderTable();
            }
        }

        window.onload = renderTable;
    </script>
</body>
</html>
