<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allocated Quarters List - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1500px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        
        .page-title { 
            text-align: center; 
            color: #7A1C1C; 
            font-size: 1.8rem; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            text-decoration: underline; 
            text-underline-offset: 6px; 
            font-weight: 700;
        }

        /* Search Bar Card Box */
        .search-card { 
            background: #ffffff; 
            padding: 20px 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
        }

        /* Table Card Box */
        .table-card { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            border-top: 5px solid #7A1C1C; 
            overflow-x: auto; 
            position: relative; 
        }

        .search-wrapper { display: flex; gap: 10px; align-items: center; }
        .search-input { padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; width: 300px; outline: none; }
        .search-input:focus { border-color: #7A1C1C; box-shadow: 0 0 0 3px rgba(122, 28, 28, 0.1); }
        
        .search-btn { background-color: #7A1C1C; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .search-btn:hover { background-color: #571a1a; }
        
        .add-btn { background-color: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; }
        .add-btn:hover { background-color: #059669; }

        .allocated-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1200px; }
        .allocated-table th, .allocated-table td { padding: 12px 10px; border: 1px solid #cbd5e1; vertical-align: middle; font-size: 0.85rem; text-align: center; }
        .allocated-table th { background-color: #f8fafc; color: #1e293b; font-weight: 700; }
        .allocated-table td { color: #334155; }
        
        .action-cell { display: flex; justify-content: center; align-items: center; gap: 6px; }
        .action-btn { border: none; width: 32px; height: 32px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s; }
        .btn-view { background-color: #8b5cf6; color: white; }
        .btn-view:hover { background-color: #7c3aed; }
        .btn-edit { background-color: #2563eb; color: white; }
        .btn-edit:hover { background-color: #1d4ed8; }
        .btn-delete { background-color: #dc2626; color: white; }
        .btn-delete:hover { background-color: #b91c1c; }
        
        /* Custom Modal for Deletion */
        .custom-msg-box { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .msg-content { background: white; padding: 25px; border-radius: 10px; text-align: center; width: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .msg-content p { margin-bottom: 20px; font-size: 1rem; color: #334155; font-weight: 600; }
        .msg-btns { display: flex; justify-content: center; gap: 10px; }
        .msg-btn { padding: 8px 15px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
        .msg-btn-yes { background-color: #dc2626; color: white; }
        .msg-btn-no { background-color: #64748b; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>

        <h2 class="page-title">Allocated Quarters List</h2>

        <!-- Separate Search Card Box -->
        <div class="search-card">
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by NIC or Computer No..." oninput="if (this.value.trim() === '') searchTable()">
                <button class="search-btn" onclick="searchTable()"><i class="fa-solid fa-search"></i> Search</button>
            </div>
            <a href="add-allocated-quarter.html" class="add-btn"><i class="fa-solid fa-plus"></i> Add New Allocation</a>
        </div>

        <!-- Separate Table Card Box -->
        <div class="table-card">
            <table class="allocated-table" id="allocatedTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>NIC</th>
                        <th>Computer No.</th>
                        <th>Quarter Type</th>
                        <th>Resident Name</th>
                        <th>Designation</th>
                        <th>Workplace</th>
                        <th>Allocated Date</th>
                        <th>Other</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="allocatedBody">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div class="custom-msg-box" id="deleteModal">
        <div class="msg-content">
            <p><i class="fa-solid fa-triangle-exclamation" style="color: #dc2626; font-size: 1.5rem; margin-bottom: 10px; display:block;"></i> Are you sure you want to delete this allocated quarter record?</p>
            <div class="msg-btns">
                <button class="msg-btn msg-btn-yes" id="confirmDeleteBtn">Yes, Delete</button>
                <button class="msg-btn msg-btn-no" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const defaultAllocatedData = [
            {
                nic: "199812345678",
                computerNo: "101",
                quarterType: "Grade II",
                residentName: "A. B. Perera",
                designation: "Clerk",
                workplace: "Colombo Fort",
                allocatedDate: "2026-01-10",
                other: "None"
            },
            {
                nic: "199912345678",
                computerNo: "102",
                quarterType: "Grade III",
                residentName: "N. K. Silva",
                designation: "Station Master",
                workplace: "Maradana",
                allocatedDate: "2026-02-15",
                other: "Sample record"
            }
        ];

        window.addEventListener('DOMContentLoaded', () => { loadTableData(); });

        function getStoredData() {
            const data = localStorage.getItem('allocatedQuartersData');
            if (data) {
                const parsed = JSON.parse(data);
                if (parsed.length > 0) {
                    const dummyRecord = defaultAllocatedData.find(item => item.other === 'Sample record');
                    if (!localStorage.getItem('allocatedQuartersDummySeeded')) {
                        if (!parsed.some(item => item.nic === dummyRecord.nic && item.computerNo === dummyRecord.computerNo)) {
                            parsed.push(dummyRecord);
                            saveStoredData(parsed);
                        }
                        localStorage.setItem('allocatedQuartersDummySeeded', 'true');
                    }
                    return parsed;
                }
            }
            return defaultAllocatedData;
        }

        function saveStoredData(data) {
            localStorage.setItem('allocatedQuartersData', JSON.stringify(data));
        }

        function loadTableData() {
            const tbody = document.getElementById('allocatedBody');
            tbody.innerHTML = '';
            const data = getStoredData();

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.nic}</td>
                    <td>${item.computerNo}</td>
                    <td>${item.quarterType}</td>
                    <td>${item.residentName}</td>
                    <td>${item.designation}</td>
                    <td>${item.workplace}</td>
                    <td>${item.allocatedDate}</td>
                    <td>${item.other || 'None'}</td>
                    <td>
                        <div class="action-cell">
                            <a href="view-allocated-quarter.html?id=${index}" class="action-btn btn-view" title="View Details"><i class="fa-solid fa-eye"></i></a>
                            <a href="edit-allocated-quarter.html?id=${index}" class="action-btn btn-edit" title="Edit"><i class="fa-solid fa-pen"></i></a>
                            <button class="action-btn btn-delete" onclick="promptDelete(${index})" title="Delete"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function searchTable() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const tbody = document.getElementById("allocatedBody");
            const trs = tbody.getElementsByTagName("tr");

            for (let i = 0; i < trs.length; i++) {
                const nicTd = trs[i].getElementsByTagName("td")[1];
                const compNoTd = trs[i].getElementsByTagName("td")[2];
                
                if (nicTd || compNoTd) {
                    const nicText = nicTd ? nicTd.textContent.toLowerCase() : "";
                    const compText = compNoTd ? compNoTd.textContent.toLowerCase() : "";

                    if (nicText.includes(input) || compText.includes(input)) {
                        trs[i].style.display = "";
                    } else {
                        trs[i].style.display = "none";
                    }
                }
            }
        }

        let deleteTargetIndex = null;
        function promptDelete(index) {
            deleteTargetIndex = index;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            deleteTargetIndex = null;
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            if (deleteTargetIndex !== null) {
                const data = getStoredData();
                data.splice(deleteTargetIndex, 1);
                saveStoredData(data);
                loadTableData();
                closeDeleteModal();
            }
        });
    </script>
</body>
</html>
