<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add System User - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .page-title { text-align: center; color: #000; font-size: 2rem; margin: 0 0 25px; text-transform: uppercase; letter-spacing: 1px; }
        .form-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #1e293b; font-size: 0.9rem; }
        .form-control, .form-select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; }
        .submit-btn { background-color: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 15px; }
        .submit-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <a href="system-users.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to System Users List</a>

        <div class="form-card">
            <h2 class="page-title">Add New System User</h2>
            <form onsubmit="saveNewUser(event)">
                <div class="form-group">
                    <label>NIC Number</label>
                    <input type="text" id="nic" class="form-control" placeholder="Enter NIC number" required>
                </div>
                <div class="form-group">
                    <label>Computer Number</label>
                    <input type="text" id="computerNo" class="form-control" inputmode="numeric" pattern="[0-9]+" title="Enter digits only" placeholder="Enter computer number" required>
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Designation</label>
                    <input type="text" id="designation" class="form-control" placeholder="Enter designation" required>
                </div>
                <div class="form-group">
                    <label>System Role</label>
                    <select id="role" class="form-select" required>
                        <option value="">-- Select System Role --</option>
                        <option value="Admin">Admin</option>
                        <option value="Immediate Boss">Immediate Boss</option>
                        <option value="Personal File">Personal File</option>
                        <option value="Subject Clerk">Subject Clerk</option>
                        <option value="Branch Officer">Branch Officer</option>
                        <option value="Final Approval">Final Approval</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Current Workplace</label>
                    <input type="text" id="workplace" class="form-control" placeholder="Enter current workplace" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter email address" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone" class="form-control" placeholder="Enter phone number" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
                </div>
                <button type="submit" class="submit-btn"><i class="fa-solid fa-save"></i> Save System User</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('computerNo').addEventListener('input', event => {
            event.target.value = event.target.value.replace(/\D/g, '');
        });

        function saveNewUser(event) {
            event.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // මුරපද දෙක සමානදැයි පරීක්ෂා කිරීම
            if (password !== confirmPassword) {
                alert("Passwords do not match! Please check again.");
                document.getElementById('confirmPassword').focus();
                return;
            }

            const newUser = {
                fullName: document.getElementById('fullName').value,
                nic: document.getElementById('nic').value,
                designation: document.getElementById('designation').value,
                workplace: document.getElementById('workplace').value,
                computerNo: document.getElementById('computerNo').value,
                role: document.getElementById('role').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                password: password
            };

            let users = JSON.parse(localStorage.getItem('systemUsersList')) || [];
            users.push(newUser);
            localStorage.setItem('systemUsersList', JSON.stringify(users));

            alert("System user added successfully!");
            window.location.href = 'system-users.html';
        }
    </script>
</body>
</html>
