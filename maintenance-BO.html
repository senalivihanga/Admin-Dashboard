<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarters Maintenance - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .page-title { text-align: center; color: #7A1C1C; font-size: 2rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 8px; }
        .section-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .search-wrapper { display: flex; gap: 10px; align-items: center; }
        .search-box-wrapper { position: relative; display: flex; align-items: center; }
        .search-box-wrapper i { position: absolute; left: 14px; color: #64748b; font-size: 0.9rem; }
        .search-input { padding: 10px 14px 10px 40px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; width: 300px; outline: none; transition: all 0.2s; background-color: #ffffff; }
        .search-input:focus { border-color: #7A1C1C; box-shadow: 0 0 0 3px rgba(122, 28, 28, 0.1); }
        .search-btn { background-color: #7A1C1C; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; font-size: 0.9rem; }
        .search-btn:hover { background-color: #5c1414; }
        .table-card { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; overflow-x: auto; }
        .maint-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1100px; }
        .maint-table th, .maint-table td { padding: 12px 10px; border: 1px solid #e2e8f0; text-align: center; font-size: 0.85rem; vertical-align: middle; }
        .maint-table th { background-color: #f8fafc; color: #1e293b; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0; }
        .maint-table td { color: #4b5563; font-weight: normal; }
        .maint-table tbody td:nth-child(2) { font-weight: 700; }
        .no-data { text-align: center; padding: 20px; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <a href="quarters-list-BO.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Quarters List</a>
        <h2 class="page-title">Quarters Maintenance Details</h2>

        <div class="section-header-bar">
            <div class="search-wrapper">
                <div class="search-box-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by Quarter No or Name..." oninput="searchTable()">
                </div>
                <button type="button" class="search-btn" onclick="searchTable()"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </div>
        </div>

        <div class="table-card">
            <table class="maint-table" id="maintTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Quarter No.</th>
                        <th>Quarter Name</th>
                        <th>Quarter Location</th>
                        <th>Quarter Type</th>
                        <th>Status</th>
                        <th>Last Maintenance Date</th>
                    </tr>
                </thead>
                <tbody id="maintBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Initialize Dummy Data if LocalStorage is empty to ensure 'lastMaint' is present
            if (!localStorage.getItem('quartersData')) {
                const dummyQuarters = [
                    {
                        quarterNum: "Q-101",
                        location: "Colombo Fort",
                        quarterName: "Station View Bungalow",
                        address: "123, Railway Avenue, Colombo 01",
                        quarterType: "Grade I",
                        assessmentRent: "15,000.00",
                        status: "Available",
                        electric: true,
                        water: true,
                        lastMaint: "2026-01-15"
                    },
                    {
                        quarterNum: "Q-102",
                        location: "Maradana",
                        quarterName: "Yard Master Quarters",
                        address: "45, Technical Junction, Maradana",
                        quarterType: "Grade II",
                        assessmentRent: "10,000.00",
                        status: "Under Maintenance",
                        electric: true,
                        water: false,
                        lastMaint: "2026-02-10"
                    },
                    {
                        quarterNum: "Q-103",
                        location: "Gampaha",
                        quarterName: "Suburban Quarters",
                        address: "78, Station Road, Gampaha",
                        quarterType: "Grade III",
                        assessmentRent: "7,500.00",
                        status: "Under Maintenance",
                        electric: true,
                        water: true,
                        lastMaint: "2026-03-05"
                    }
                ];
                localStorage.setItem('quartersData', JSON.stringify(dummyQuarters));
            }

            loadMaintenanceData();
        });

        function loadMaintenanceData() {
            const tbody = document.getElementById('maintBody');
            tbody.innerHTML = '';
            
            const data = JSON.parse(localStorage.getItem('quartersData')) || [];
            let maintData = data.map((item, originalIndex) => ({ ...item, originalIndex }))
                .filter(item => (item.status || '').toLowerCase().includes('maintenance'));

            if (maintData.length === 0) {
                maintData = [
                    { quarterNum: 'Q-102', quarterName: 'Yard Master Quarters', location: 'Maradana', quarterType: 'Grade II', status: 'Under Maintenance', lastMaint: '2026-02-10' },
                    { quarterNum: 'Q-103', quarterName: 'Suburban Quarters', location: 'Gampaha', quarterType: 'Grade III', status: 'Under Maintenance', lastMaint: '2026-03-05' },
                    { quarterNum: 'Q-104', quarterName: 'Station Staff Quarters', location: 'Kandy', quarterType: 'Grade II', status: 'Under Maintenance', lastMaint: '2026-04-12' }
                ];
            }

            maintData.forEach((item, displayIndex) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${displayIndex + 1}</td>
                    <td>${item.quarterNum || '-'}</td>
                    <td>${item.quarterName || '-'}</td>
                    <td>${item.location || '-'}</td>
                    <td>${item.quarterType || '-'}</td>
                    <td>${item.status || 'Under Maintenance'}</td>
                    <td>${item.lastMaint || '2026-02-20'}</td>
                `;
                tbody.appendChild(tr);
            });

            searchTable();
        }

        function searchTable() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            document.querySelectorAll('#maintBody tr').forEach(row => {
                const quarterNumber = row.cells[1]?.textContent.toLowerCase() || '';
                const quarterName = row.cells[2]?.textContent.toLowerCase() || '';
                row.style.display = quarterNumber.includes(query) || quarterName.includes(query) ? '' : 'none';
            });
        }

    </script>
</body>
</html>
