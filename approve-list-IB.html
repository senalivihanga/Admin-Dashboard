<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approved Applications Log - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .approval-container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .approval-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .approval-container h2 {
            font-size: 2rem;
            color: #7A1C1C;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: underline;
            text-underline-offset: 6px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: #7A1C1C;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-box input {
            padding: 10px 15px 10px 38px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            width: 300px;
            outline: none;
        }
        .search-box input:focus {
            border-color: #7A1C1C;
        }
        .search-box i {
            position: absolute;
            left: 12px;
            color: #64748b;
        }
        .btn-print {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #dcfce7;
            color: #166534;
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.9rem;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #7A1C1C;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        @media print {
            .back-link, .top-action-bar { display: none !important; }
        }
    </style>
</head>
<body>
    <main class="approval-container">
        <a href="IB.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <div class="approval-header">
            <h2>Approved Applications Log</h2>
        </div>
        <div class="top-action-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search by NIC or Name..." onkeyup="renderTable()">
            </div>
            <button type="button" class="btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Report</button>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Application Number</th>
                        <th>NIC</th>
                        <th>Computer Number</th>
                        <th>Name</th>
                        <th>Designation</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        const approvedData = [
            { id: 1, appNo: "SLR/AOT/2026/0001", nic: "981234567V", compNo: "101", name: "A. B. Perera", desig: "Station Master", status: "Approved" },
            { id: 3, appNo: "SLR/AOT/2026/0003", nic: "923456789V", compNo: "105", name: "M. N. Fernando", desig: "Locomotive Driver", status: "Approved" },
            { id: 5, appNo: "SLR/AOT/2026/0005", nic: "945612378V", compNo: "112", name: "P. R. Gunawardena", desig: "Telecommunication Tech", status: "Approved" }
        ];

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            tbody.innerHTML = "";

            const filtered = approvedData.filter(item => item.nic.toLowerCase().includes(searchVal) || item.name.toLowerCase().includes(searchVal));

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b; padding: 30px;">No approved records found.</td></tr>`;
                return;
            }

            filtered.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${item.appNo}</strong></td>
                        <td>${item.nic}</td>
                        <td>${item.compNo}</td>
                        <td>${item.name}</td>
                        <td>${item.desig}</td>
                        <td><span class="badge"><i class="fa-solid fa-check"></i></span></td>
                    </tr>
                `;
            });
        }

        window.onload = renderTable;
    </script>
</body>
</html>
