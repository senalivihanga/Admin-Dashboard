<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Users Management - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .page-title { text-align: center; color: #7A1C1C; font-size: 2rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 8px; }
        .top-action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .search-section { display: flex; gap: 10px; }
        .search-input { padding: 10px 15px; width: 300px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none; }
        .search-input:focus { border-color: #7A1C1C; }
        .add-btn { background-color: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; }
        .add-btn:hover { background-color: #15803d; }
        .table-card { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; overflow-x: auto; }
        .user-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1200px; }
        .user-table th, .user-table td { padding: 12px 10px; border: 1px solid #cbd5e1; vertical-align: middle; font-size: 0.85rem; text-align: center; }
        .user-table th { background-color: #f8fafc; color: #1e293b; font-weight: 700; }
        .user-table td { color: #334155; }
        .action-btns-group { display: flex; justify-content: center; gap: 6px; }
        .btn-row-action { padding: 6px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .btn-view { background-color: #2563eb; color: white; }
        .btn-view:hover { background-color: #1d4ed8; }
        .btn-edit { background-color: #f59e0b; color: white; }
        .btn-edit:hover { background-color: #d97706; }
        .btn-delete { background-color: #dc2626; color: white; }
        .btn-delete:hover { background-color: #b91c1c; }

        /* Custom Delete Modal */
        .custom-msg-box { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .msg-content { background: white; padding: 25px; border-radius: 10px; text-align: center; width: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .msg-content p { margin-bottom: 20px; font-size: 1rem; color: #334155; font-weight: 600; }
        .msg-btns { display: flex; justify-content: center; gap: 10px; }
        .msg-btn { padding: 8px 15px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
        .msg-btn-yes { background-color: #dc2626; color: white; }
        .msg-btn-no { background-color: #64748b; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h2 class="page-title">System Users Management</h2>

        <div class="top-action-bar">
            <div class="search-section">
                <input type="text" class="search-input" id="searchInput" placeholder="Search by NIC..." onkeyup="filterTable()">
            </div>
            <a href="add-system-user.html" class="add-btn"><i class="fa-solid fa-user-plus"></i> Add System User</a>
        </div>

        <div class="table-card">
            <table class="user-table" id="assignTable">
                <thead>
                    <tr>
                        <th></th>
                        <th>Full Name</th>
                        <th>NIC</th>
                        <th>Designation</th>
                        <th>Current Workplace</th>
                        <th>Computer No.</th>
                        <th>System Role</th>
                        <th>Phone Number</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Custom Delete Modal -->
    <div class="custom-msg-box" id="deleteModal">
        <div class="msg-content">
            <p><i class="fa-solid fa-triangle-exclamation" style="color: #dc2626; font-size: 1.5rem; margin-bottom: 10px; display:block;"></i> Are you sure you want to delete this system user record?</p>
            <div class="msg-btns">
                <button class="msg-btn msg-btn-yes" id="confirmDeleteBtn">Yes, Delete</button>
                <button class="msg-btn msg-btn-no" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const defaultUsers = [
            {
                fullName: "A. B. Perera",
                nic: "199812345678",
                designation: "Transport Manager",
                workplace: "Colombo Fort",
                computerNo: "CMP-001",
                role: "Admin",
                phone: "0712345678",
                email: "perera@railway.gov.lk"
            },
            {
                fullName: "S. K. Silva",
                nic: "199287654321",
                designation: "Subject Clerk",
                workplace: "Maradana",
                computerNo: "CMP-002",
                role: "Subject Clerk",
                phone: "0778765432",
                email: "silva@railway.gov.lk"
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadUsers();
        });

        function getUsers() {
            const data = localStorage.getItem('systemUsersList');
            return data ? JSON.parse(data) : defaultUsers;
        }

        function saveUsers(data) {
            localStorage.setItem('systemUsersList', JSON.stringify(data));
        }

        function loadUsers() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';
            const users = getUsers();

            users.forEach((user, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${user.fullName}</td>
                    <td>${user.nic}</td>
                    <td>${user.designation}</td>
                    <td>${user.workplace}</td>
                    <td>${user.computerNo}</td>
                    <td>${user.role}</td>
                    <td>${user.phone}</td>
                    <td>${user.email}</td>
                    <td>
                        <div class="action-btns-group">
                            <a href="view-system-user.html?index=${index}" class="btn-row-action btn-view"><i class="fa-solid fa-eye"></i></a>
                            <a href="edit-system-user.html?index=${index}" class="btn-row-action btn-edit"><i class="fa-solid fa-pen"></i></a>
                            <button class="btn-row-action btn-delete" onclick="promptDelete(${index})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        let deleteTargetIndex = null;
        function promptDelete(index) {
            deleteTargetIndex = index;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            deleteTargetIndex = null;
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            if (deleteTargetIndex !== null) {
                let users = getUsers();
                users.splice(deleteTargetIndex, 1);
                saveUsers(users);
                loadUsers();
                closeDeleteModal();
            }
        });

        function filterTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#userTableBody tr');
            rows.forEach(row => {
                const nicText = row.cells[2].innerText.toLowerCase();
                if (nicText.includes(input)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
