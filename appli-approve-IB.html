<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Approval List - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container { 
            max-width: 1500px; 
            margin: 40px auto; 
            padding: 0 20px; 
        }

        .back-link { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            color: #7A1C1C; 
            text-decoration: none; 
            font-weight: 600; 
            margin-bottom: 20px; 
        }
        
        .page-title { 
            text-align: center; 
            color: #7A1C1C; 
            font-size: 1.8rem; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            text-decoration: underline; 
            text-underline-offset: 6px; 
            font-weight: 700;
        }

        .search-card { 
            background: #ffffff; 
            padding: 20px 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
        }

        .table-card { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            border-top: 5px solid #7A1C1C; 
            overflow-x: auto; 
            position: relative; 
        }

        .search-wrapper { display: flex; gap: 10px; align-items: center; }
        .search-input { padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; width: 300px; outline: none; }
        .search-input:focus { border-color: #7A1C1C; box-shadow: 0 0 0 3px rgba(122, 28, 28, 0.1); }
        
        .search-btn { background-color: #7A1C1C; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .search-btn:hover { background-color: #571a1a; }
        
        .print-btn { background-color: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; }
        .print-btn:hover { background-color: #0369a1; }

        .approval-table { width: 100%; border-collapse: collapse; text-align: left; }
        .approval-table th, .approval-table td { padding: 12px 10px; border: 1px solid #cbd5e1; vertical-align: middle; font-size: 0.85rem; text-align: center; }
        .approval-table th { background-color: #f8fafc; color: #1e293b; font-weight: 700; text-transform: uppercase; }
        .approval-table td { color: #334155; }
        
        .action-cell { display: flex; justify-content: center; align-items: center; gap: 6px; }
        .action-btn { border: none; width: 32px; height: 32px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s; color: white; }
        .btn-view { background-color: #8b5cf6; }
        .btn-view:hover { background-color: #7c3aed; }
        .btn-approve { background-color: #10b981; }
        .btn-approve:hover { background-color: #059669; }
        .btn-reject { background-color: #dc2626; }
        .btn-reject:hover { background-color: #b91c1c; }

        /* System Alert */
        .system-alert {
            background-color: #f0fdf4;
            color: #166534;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            border: 1px solid #bbf7d0;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .system-alert.error {
            background-color: #fef2f2;
            color: #991b1b;
            border-color: #fecaca;
        }

        /* Custom Modal for Rejection */
        .custom-msg-box { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .msg-content { background: white; padding: 25px; border-radius: 10px; width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .msg-content h3 { color: #7A1C1C; margin-bottom: 15px; font-size: 1.1rem; }
        .msg-content textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 15px; outline: none; box-sizing: border-box; font-family: inherit; }
        .msg-btns { display: flex; justify-content: flex-end; gap: 10px; }
        .msg-btn { padding: 8px 15px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; color: white; }
        .msg-btn-yes { background-color: #dc2626; }
        .msg-btn-no { background-color: #64748b; }

        .fade-out {
            opacity: 0;
            transform: scale(0.98);
            transition: all 0.4s ease;
        }

        /* Print Media Styles - Fixed for full table view */
        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background-color: #ffffff !important; -webkit-print-color-adjust: exact; }
            .back-link, .search-card, .system-alert { display: none !important; }
            .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
            .table-card { box-shadow: none !important; border: none !important; padding: 0 !important; overflow: visible !important; }
            .approval-table { width: 100% !important; font-size: 8pt !important; }
            .approval-table th, .approval-table td { padding: 6px 4px !important; }
            /* Hide View Application and Actions columns during print */
            th:nth-child(7), td:nth-child(7),
            th:nth-child(8), td:nth-child(8) { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="IB.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>

        <h2 class="page-title">Application Approval List</h2>

        <div class="search-card">
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by NIC or Name..." oninput="checkSearchClear(this)">
                <button class="search-btn" onclick="filterTable()"><i class="fa-solid fa-search"></i> Search</button>
            </div>
            <button type="button" class="print-btn" onclick="window.print()"><i class="fa-solid fa-print"></i> Print / Save as PDF</button>
        </div>

        <div id="systemAlert" class="system-alert">
            <i id="alertIcon" class="fa-solid fa-circle-check"></i> 
            <span id="alertMessageText">Action completed successfully.</span>
        </div>

        <div class="table-card">
            <table class="approval-table" id="approvalTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Application Number</th>
                        <th>NIC</th>
                        <th>Computer Number</th>
                        <th>Name</th>
                        <th>Designation</th>
                        <th>View Application</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Custom Rejection Modal -->
    <div class="custom-msg-box" id="rejectModal">
        <div class="msg-content">
            <h3>Provide Rejection Reason</h3>
            <textarea id="rejectionReasonInput" rows="3" placeholder="Enter reason for rejection..."></textarea>
            <div class="msg-btns">
                <button class="msg-btn msg-btn-no" onclick="closeRejectModal()">Cancel</button>
                <button class="msg-btn msg-btn-yes" onclick="confirmRejection()">Confirm Rejection</button>
            </div>
        </div>
    </div>

    <script>
        let applicationData = [
            { id: 1, appNo: "SLR/AOT/2026/0001", nic: "981234567V", compNo: "1054", name: "A. B. Perera", desig: "Station Master" },
            { id: 2, appNo: "SLR/AOT/2026/0002", nic: "957891234V", compNo: "1055", name: "K. D. Silva", desig: "Signal Inspector" },
            { id: 3, appNo: "SLR/AOT/2026/0003", nic: "923456789V", compNo: "1056", name: "M. N. Fernando", desig: "Locomotive Driver" }
        ];

        let currentRejectRowId = null;

        window.addEventListener('DOMContentLoaded', () => { 
            renderTable(applicationData); 
        });

        function renderTable(dataToRender) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (dataToRender.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #64748b; padding: 30px;">No applications found.</td></tr>`;
                return;
            }

            dataToRender.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${item.id}`;
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${item.appNo}</strong></td>
                    <td>${item.nic}</td>
                    <td>${item.compNo}</td>
                    <td>${item.name}</td>
                    <td>${item.desig}</td>
                    <td>
                        <div class="action-cell">
                            <a href="view-application-details.html?id=${item.id}" class="action-btn btn-view" title="View Application"><i class="fa-solid fa-eye"></i></a>
                        </div>
                    </td>
                    <td>
                        <div class="action-cell">
                            <button class="action-btn btn-approve" onclick="handleApprove(${item.id})" title="Approve"><i class="fa-solid fa-check"></i></button>
                            <button class="action-btn btn-reject" onclick="promptReject(${item.id})" title="Reject"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            const input = document.getElementById("searchInput").value.toLowerCase().trim();
            const filtered = applicationData.filter(item => 
                item.nic.toLowerCase().includes(input) || item.name.toLowerCase().includes(input)
            );
            renderTable(filtered);
        }

        function checkSearchClear(input) {
            if (input.value.trim() === "") {
                renderTable(applicationData);
            }
        }

        function showSystemAlert(msg, type = 'success') {
            const alertBox = document.getElementById('systemAlert');
            const alertText = document.getElementById('alertMessageText');
            const alertIcon = document.getElementById('alertIcon');

            alertText.innerText = msg;

            if (type === 'error') {
                alertBox.className = 'system-alert error';
                alertIcon.className = 'fa-solid fa-triangle-exclamation';
            } else {
                alertBox.className = 'system-alert';
                alertIcon.className = 'fa-solid fa-circle-check';
            }

            alertBox.style.display = 'flex';
            setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
        }

        function handleApprove(id) {
            const index = applicationData.findIndex(item => item.id == id);

            if (index > -1) {
                const approvedItem = applicationData[index];
                let approvedList = JSON.parse(localStorage.getItem('approvedApplications')) || [];
                approvedList.push(approvedItem);
                localStorage.setItem('approvedApplications', JSON.stringify(approvedList));

                showSystemAlert("Application approved successfully and moved to Approved List.", "success");
                
                const row = document.getElementById(`row-${id}`);
                if (row) {
                    row.classList.add('fade-out');
                }
                
                setTimeout(() => {
                    applicationData.splice(index, 1);
                    filterTable();
                }, 400);
            }
        }

        function promptReject(id) {
            currentRejectRowId = id;
            document.getElementById('rejectionReasonInput').value = '';
            document.getElementById('rejectModal').style.display = 'flex';
        }

        function closeRejectModal() {
            document.getElementById('rejectModal').style.display = 'none';
            currentRejectRowId = null;
        }

        function confirmRejection() {
            const reason = document.getElementById('rejectionReasonInput').value.trim();
            if (!reason) {
                alert("Please enter a rejection reason.");
                return;
            }

            if (currentRejectRowId !== null) {
                const index = applicationData.findIndex(item => item.id == currentRejectRowId);

                if (index > -1) {
                    const rejectedItem = { ...applicationData[index], rejectionReason: reason };
                    let rejectedList = JSON.parse(localStorage.getItem('rejectedApplications')) || [];
                    rejectedList.push(rejectedItem);
                    localStorage.setItem('rejectedApplications', JSON.stringify(rejectedList));

                    closeRejectModal();
                    showSystemAlert("Application rejected and moved to Rejected List.", "error");

                    const row = document.getElementById(`row-${currentRejectRowId}`);
                    if (row) {
                        row.classList.add('fade-out');
                    }

                    setTimeout(() => {
                        applicationData.splice(index, 1);
                        filterTable();
                        currentRejectRowId = null;
                    }, 400);
                }
            }
        }
    </script>
</body>
</html>
