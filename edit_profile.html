<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f4f4;
        }
        .profile-wrapper {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #7A1C1C;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #5c1414;
        }
        .profile-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-top: 5px solid #7A1C1C;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .profile-header h2 {
            color: #222;
            font-size: 1.6rem;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .profile-header i {
            font-size: 2.5rem;
            color: #7A1C1C;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }
        .input-with-icon {
            position: relative;
        }
        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }
        .form-group input {
            width: 100%;
            padding: 11px 12px 11px 45px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #7A1C1C;
        }
        .section-title {
            font-size: 1.1rem;
            color: #7A1C1C;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 6px;
            margin: 25px 0 15px 0;
            font-weight: 700;
        }
        .btn-save {
            width: 100%;
            padding: 12px;
            background-color: #7A1C1C;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-save:hover {
            background-color: #5c1414;
        }
    </style>
</head>
<body>

    <div class="profile-wrapper">
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>

        <div class="profile-card">
            <div class="profile-header">
                <i class="fa-solid fa-user-pen"></i>
                <h2>Edit Admin Profile</h2>
            </div>
            
            <form action="index.html" method="GET">
                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" >
                    </div>
                </div>

                <!-- Computer Number -->
                <div class="form-group">
                    <label for="computer_no">Computer Number</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-desktop"></i>
                        <input type="text" id="computer_no" name="computer_no" placeholder="Enter your computer number">
                    </div>
                </div>

                <!-- Mobile Number -->
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" pattern="[0-9]{10}">
                    </div>
                </div>

                <!-- WhatsApp Number -->
                <div class="form-group">
                    <label for="whatsapp">WhatsApp Number</label>
                    <div class="input-with-icon">
                        <i class="fa-brands fa-whatsapp" style="color: #25d366; font-size: 1.1rem;"></i>
                        <input type="tel" id="whatsapp" name="whatsapp" placeholder="Enter WhatsApp number">
                </div>

                <!-- Change Password Section -->
                <div class="section-title">Change Password</div>

                <div class="form-group">
                    <label for="current_password">Current Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="current_password" name="current_password" placeholder="Enter current password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="new_password" name="new_password" placeholder="Enter new password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password">
                    </div>
                </div>

                <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
            </form>
        </div>
    </div>

</body>
</html>
