<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Quarter - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        .checkbox-group { display: flex; gap: 20px; margin-top: 10px; }
        .checkbox-group label { font-weight: normal; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .btn-submit { background-color: #16a34a; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .btn-submit:hover { background-color: #15803d; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div style="max-width: 600px; margin: 40px auto 0 auto; padding: 0 20px;">
        <a href="quarters-list.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Quarters List</a>
    </div>

    <div class="form-container">
        <h2 style="color: #7A1C1C; margin-bottom: 20px; text-align: center;">Add New Quarter</h2>
        <form id="addQuarterForm">
            <div class="form-group">
                <label for="quarterNum">Quarter No.</label>
                <input type="text" id="quarterNum" placeholder="e.g. Q-02" required>
            </div>
            <div class="form-group">
                <label for="location">Quarter Location</label>
                <input type="text" id="location" placeholder="e.g. Kandy" required>
            </div>
            <div class="form-group">
                <label for="quarterName">Quarter Name</label>
                <input type="text" id="quarterName" placeholder="e.g. Station Master Quarters">
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="e.g. Station Road, Kandy">
            </div>
            <div class="form-group">
                <label for="quarterType">Quarter Type</label>
                <select id="quarterType" required>
                    <option value="Bungalows">Bungalows</option>
                    <option value="Type I">Type I</option>
                    <option value="Type II">Type II</option>
                    <option value="Type III">Type III</option>
                </select>
            </div>
            <div class="form-group">
                <label for="assessmentRent">Assessment Rent (LKR)</label>
                <input type="number" id="assessmentRent" step="0.01" placeholder="Enter assessment rent amount" required>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" required>
                    <option value="Available">Available</option>
                    <option value="Occupied">Occupied</option>
                    <option value="Under Maintenance">Under Maintenance</option>
                </select>
            </div>
            <div class="form-group">
                <label>Facilities</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="electric" checked> Electricity</label>
                    <label><input type="checkbox" id="water" checked> Water</label>
                </div>
            </div>
            <button type="submit" class="btn-submit">Save Quarter</button>
        </form>
    </div>

    <script>
        document.getElementById('addQuarterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newQuarter = {
                quarterNum: document.getElementById('quarterNum').value,
                location: document.getElementById('location').value,
                quarterName: document.getElementById('quarterName').value,
                address: document.getElementById('address').value,
                quarterType: document.getElementById('quarterType').value,
                assessmentRent: document.getElementById('assessmentRent').value,
                status: document.getElementById('status').value,
                electric: document.getElementById('electric').checked,
                water: document.getElementById('water').checked
            };

            const existingData = JSON.parse(localStorage.getItem('quartersData')) || [];
            existingData.push(newQuarter);
            localStorage.setItem('quartersData', JSON.stringify(existingData));

            window.location.href = 'quarters-list.html';
        });
    </script>
</body>
</html>
