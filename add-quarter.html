<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Quarter - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .page-title { text-align: center; color: #7A1C1C; font-size: 2rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 8px; }
        .form-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #1e293b; font-size: 0.9rem; }
        .form-control, .form-select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; }
        .checkbox-container { display: flex; gap: 20px; margin-top: 10px; }
        .checkbox-container label { font-weight: normal; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .submit-btn { background-color: #16a34a; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .submit-btn:hover { background-color: #15803d; }
        .maint-date-group { display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="quarters.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Quarters List</a>
        <h2 class="page-title">Add New Quarter</h2>

        <div class="form-card">
            <form id="addQuarterForm" onsubmit="saveNewQuarter(event)">
                <div class="form-group">
                    <label>Quarter No.</label>
                    <input type="text" id="quarterNum" class="form-control" placeholder="e.g. Q-02" required>
                </div>
                <div class="form-group">
                    <label>Quarter Location</label>
                    <input type="text" id="location" class="form-control" placeholder="e.g. Kandy" required>
                </div>
                <div class="form-group">
                    <label>Quarter Name</label>
                    <input type="text" id="quarterName" class="form-control" placeholder="e.g. Station Master Quarters" required>
                </div>
                <div class="form-group">
                    <label>Quarter Type</label>
                    <input type="text" id="quarterType" class="form-control" placeholder="e.g. Bungalows" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status" class="form-select" onchange="toggleMaintDate(this)">
                        <option value="Occupied">Occupied</option>
                        <option value="Vacant">Vacant</option>
                        <option value="Under Maintenance">Under Maintenance</option>
                        <option value="Unusable">Unusable</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group maint-date-group" id="maintDateGroup">
                    <label>Last Maintenance Date</label>
                    <input type="date" id="lastMaint" class="form-control">
                </div>
                <div class="form-group">
                    <label>Facilities</label>
                    <div class="checkbox-container">
                        <label><input type="checkbox" id="electric" checked> Electricity Supply</label>
                        <label><input type="checkbox" id="water" checked> Water Supply</label>
                    </div>
                </div>
                <button type="submit" class="submit-btn"><i class="fa-solid fa-save"></i> Save Quarter Details</button>
            </form>
        </div>
    </div>

    <script>
        function toggleMaintDate(select) {
            const maintGroup = document.getElementById('maintDateGroup');
            if (select.value === 'Under Maintenance') {
                maintGroup.style.display = 'block';
            } else {
                maintGroup.style.display = 'none';
                document.getElementById('lastMaint').value = '';
            }
        }

        function saveNewQuarter(event) {
            event.preventDefault();

            const quarterNum = document.getElementById('quarterNum').value;
            const location = document.getElementById('location').value;
            const quarterName = document.getElementById('quarterName').value;
            const quarterType = document.getElementById('quarterType').value;
            const status = document.getElementById('status').value;
            const lastMaint = document.getElementById('lastMaint').value;
            const electric = document.getElementById('electric').checked;
            const water = document.getElementById('water').checked;

            const newQuarter = {
                quarterNum,
                location,
                quarterName,
                quarterType,
                status,
                lastMaint: status === 'Under Maintenance' ? lastMaint : "",
                electric,
                water
            };

            const existingData = JSON.parse(localStorage.getItem('quartersData')) || [];
            existingData.push(newQuarter);
            localStorage.setItem('quartersData', JSON.stringify(existingData));

            alert("New Quarter added successfully!");
            window.location.href = 'quarters.html';
        }
    </script>
</body>
</html>
