<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Quarter Allocation - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .card { background: #ffffff; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-top: 5px solid #7A1C1C; }
        .card h2 { color: #1e293b; font-size: 1.6rem; margin-bottom: 20px; text-transform: uppercase; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #475569; margin-bottom: 8px; font-size: 0.95rem; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.95rem; box-sizing: border-box; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn-submit { background-color: #059669; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; font-size: 1rem; transition: background 0.2s; }
        .btn-submit:hover { background-color: #047857; }
        #successAlert { display: none; background-color: #dcfce7; color: #166534; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; border: 1px solid #bbf7d0; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <a href="FA.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to FA Dashboard</a>

        <div class="card">
            <h2><i class="fa-solid fa-hand-holding-heart"></i> Direct Quarter Allocation</h2>
            
            <div id="successAlert"><i class="fa-solid fa-circle-check"></i> Direct allocation completed and linked to application successfully!</div>

            <form id="directAllocationForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Applicant NIC Number:</label>
                        <input type="text" id="nic" required placeholder="Enter NIC number">
                    </div>
                    <div class="form-group">
                        <label>Computer Number:</label>
                        <input type="text" id="computerNo" required placeholder="Enter computer number">
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" id="fullName" required placeholder="Enter full name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address:</label>
                        <input type="email" id="email" required placeholder="Enter email address">
                    </div>
                    <div class="form-group">
                        <label>Mobile Number:</label>
                        <input type="text" id="phone" required placeholder="Enter mobile number">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Select Quarter to Allocate:</label>
                        <select id="quarterSelect" required>
                            <option value="">-- Select Available Quarter --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Approval Authority Reason:</label>
                        <input type="text" id="reason" required placeholder="e.g., Special Service Requirement">
                    </div>
                </div>

                <button type="submit" class="btn-submit"><i class="fa-solid fa-check-circle"></i> Save & Connect to Application</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('directAllocationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const allocationData = {
                nic: document.getElementById('nic').value,
                computerNo: document.getElementById('computerNo').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                quarter: document.getElementById('quarterSelect').value,
                reason: document.getElementById('reason').value,
                status: "Directly Approved by FA",
                date: new Date().toISOString()
            };

            // Save data to localStorage to sync with the application modules / Sinhala Application records
            let existingAllocations = JSON.parse(localStorage.getItem('directAllocations')) || [];
            existingAllocations.push(allocationData);
            localStorage.setItem('directAllocations', JSON.stringify(existingAllocations));

            // Also push to systemUsersList so it reflects as an approved user record
            let systemUsers = JSON.parse(localStorage.getItem('systemUsersList')) || [];
            systemUsers.push(allocationData);
            localStorage.setItem('systemUsersList', JSON.stringify(systemUsers));

            // Show success alert
            const alertBox = document.getElementById('successAlert');
            alertBox.style.display = 'block';

            setTimeout(() => {
                window.location.href = "language_dashboard.html"; // Redirect to status or approved list after saving
            }, 2000);
        });
    </script>
</body>
</html>
