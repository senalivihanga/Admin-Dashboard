<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View System User Details - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 36px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 18px; padding: 8px 0; }
        .back-link:hover { color: #541313; }
        
        .card { background: #ffffff; border-radius: 8px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08); border-top: 5px solid #7A1C1C; padding: 30px 34px; }
        .title { display: flex; align-items: center; justify-content: center; gap: 11px; color: #111827; font-size: 1.65rem; font-weight: 700; margin: 0 0 25px; }
        .title i { color: #111827; font-size: 1.35rem; }
        
        .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
        .details-row { display: flex; flex-direction: column; gap: 6px; padding: 15px 0; border-bottom: 1px solid #e5e7eb; min-width: 0; }
        .label { color: #64748b; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; }
        .value { color: #17212b; font-weight: 600; font-size: 0.98rem; overflow-wrap: anywhere; }
        .not-found { margin: 0; padding: 20px 0; color: #b42318; text-align: center; font-weight: 600; }

        @media (max-width: 600px) {
            .container { margin: 22px auto; padding: 0 14px; }
            .card { padding: 24px 20px; }
            .title { font-size: 1.35rem; margin-bottom: 16px; }
            .details-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="system-users.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to User List</a>
        
        <div class="card">
            <h2 class="title"><i class="fa-solid fa-address-card" aria-hidden="true"></i> SYSTEM USER DETAILED VIEW</h2>
            
            <div id="detailsContainer" class="details-grid">
                <!-- Dynamic Data Will Load Here -->
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const index = urlParams.get('index') !== null ? urlParams.get('index') : urlParams.get('id');
            const users = JSON.parse(localStorage.getItem('systemUsersList') || '[]');
            const userIndex = index === null ? -1 : Number(index);
            const user = Number.isInteger(userIndex) && userIndex >= 0 ? users[userIndex] : null;

            const container = document.getElementById('detailsContainer');
            if (user) {
                const fields = [
                    ['No.', String(userIndex + 1)],
                    ['NIC Number', user.nic],
                    ['Computer Number', user.computerNo],
                    ['Name', user.fullName],
                    ['Designation', user.designation],
                    ['System Role', user.role],
                    ['Current Workplace', user.workplace],
                    ['Email Address', user.email],
                    ['Phone Number', user.phone]
                ];

                fields.forEach(([label, value]) => {
                    const row = document.createElement('div');
                    row.className = 'details-row';
                    const labelElement = document.createElement('span');
                    labelElement.className = 'label';
                    labelElement.textContent = `${label}:`;
                    const valueElement = document.createElement('span');
                    valueElement.className = 'value';
                    valueElement.textContent = value || 'N/A';
                    row.append(labelElement, valueElement);
                    container.appendChild(row);
                });
            } else {
                container.innerHTML = '<p class="not-found">System User not found!</p>';
            }
        });
    </script>
</body>
</html>
