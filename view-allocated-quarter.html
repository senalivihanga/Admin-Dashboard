<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Allocated Quarter - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        
        /* Topic updated: black color, underline removed, and placed inside view card */
        .page-title { text-align: center; color: #000000; font-size: 1.8rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        
        .view-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; }
        .view-row { display: flex; border-bottom: 1px solid #f1f5f9; padding: 12px 0; font-size: 0.95rem; }
        .view-row:last-child { border-bottom: none; }
        .view-label { font-weight: 700; width: 220px; color: #475569; }
        .view-value { color: #1e293b; flex: 1; font-weight: 400; }
    </style>
</head>
<body>

    <div class="container">
        <a href="allocated-quarters.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to List</a>

        <div class="view-card" id="viewCard">
            <!-- Topic moved inside box with black color and no underline -->
            <h2 class="page-title">Allocation Detailed View</h2>
            <div id="viewContent">
                <!-- Dynamic Data will load here -->
            </div>
        </div>
    </div>

    <script>
    const defaultAllocatedData = [
        {
            nic: "199812345678",
            computerNo: "101",
            quarterType: "Grade II",
            residentName: "A. B. Perera",
            designation: "Clerk",
            workplace: "Colombo Fort",
            allocatedDate: "2026-01-10",
            other: "None"
        }
    ];

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const index = urlParams.get('id');
        
        let data = JSON.parse(localStorage.getItem('allocatedQuartersData'));
        if (!data || data.length === 0) {
            data = defaultAllocatedData;
            localStorage.setItem('allocatedQuartersData', JSON.stringify(data));
        }

        const viewContent = document.getElementById('viewContent');
        if (index !== null && data[index]) {
            const item = data[index];
            viewContent.innerHTML = `
                <div class="view-row"><div class="view-label">Auto ID:</div><div class="view-value">${parseInt(index) + 1}</div></div>
                <div class="view-row"><div class="view-label">NIC:</div><div class="view-value">${item.nic}</div></div>
                <div class="view-row"><div class="view-label">Computer No:</div><div class="view-value">${item.computerNo}</div></div>
                <div class="view-row"><div class="view-label">Quarter Type:</div><div class="view-value">${item.quarterType}</div></div>
                <div class="view-row"><div class="view-label">Resident Name:</div><div class="view-value">${item.residentName}</div></div>
                <div class="view-row"><div class="view-label">Designation:</div><div class="view-value">${item.designation}</div></div>
                <div class="view-row"><div class="view-label">Workplace:</div><div class="view-value">${item.workplace}</div></div>
                <div class="view-row"><div class="view-label">Allocated Date:</div><div class="view-value">${item.allocatedDate}</div></div>
                <div class="view-row"><div class="view-label">Other:</div><div class="view-value">${item.other || 'None'}</div></div>
            `;
        } else {
            viewContent.innerHTML = `<p style="text-align: center; color: #dc2626; font-weight: 600; padding: 20px 0;">Record not found!</p>`;
        }
    });
</script>
</body>
</html>
