<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarters List - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1350px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .page-title { text-align: center; color: #7A1C1C; font-size: 2rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 8px; }
        .top-action-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .add-btn { background-color: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .add-btn:hover { background-color: #15803d; }
        .table-card { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; overflow-x: auto; }
        .quarters-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1200px; }
        .quarters-table th, .quarters-table td { padding: 10px 8px; border: 1px solid #cbd5e1; vertical-align: middle; font-size: 0.85rem; text-align: center; }
        .quarters-table th { background-color: #f8fafc; color: #1e293b; font-weight: 700; }
        .quarters-table td { color: #334155; }
        .action-btn { border: none; padding: 6px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem; margin: 2px; }
        .btn-edit { background-color: #f59e0b; color: white; }
        .btn-edit:hover { background-color: #d97706; }
        .btn-save { background-color: #2563eb; color: white; display: none; }
        .btn-save:hover { background-color: #1d4ed8; }
        .btn-delete { background-color: #dc2626; color: white; }
        .btn-delete:hover { background-color: #b91c1c; }
        .btn-form, .btn-view { background-color: #93c5fd; color: #1e3a8a; }
        .editable-input, .dropdown-select { width: 100%; padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.85rem; box-sizing: border-box; }
        .editable-input[readonly] { background-color: transparent; border: none; text-align: center; color: #334155; }
        .editable-input[readonly].text-left { text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h2 class="page-title">Quarters Details</h2>

        <div class="top-action-bar">
            <button class="add-btn" onclick="addNewQuarterRow()"><i class="fa-solid fa-plus"></i> Add New Quarter</button>
        </div>

        <div class="table-card">
            <table class="quarters-table" id="quartersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Number of Quarters</th>
                        <th>Score Measure</th>
                        <th>Type of Quarters</th>
                        <th>Address</th>
                        <th>Other Details</th>
                        <th>Sub Dept Form</th>
                        <th>Status</th>
                        <th>Owner Computer No.</th>
                        <th>Old Booking</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="quartersBody">
                    <tr data-id="1">
                        <td>1</td>
                        <td><input type="text" class="editable-input" value="Q-01" readonly></td>
                        <td><input type="text" class="editable-input" value="85" readonly></td>
                        <td>
                            <select class="dropdown-select" disabled>
                                <option value="Bungalows" selected>Bungalows</option>
                                <option value="Field">Field</option>
                                <option value="Single">Single</option>
                                <option value="Couple">Couple</option>
                                <option value="Row">Row</option>
                                <option value="Line">Line</option>
                                <option value="Flats">Flats</option>
                                <option value="Double">Double</option>
                                <option value="Flat">Flat</option>
                                <option value="Twin">Twin</option>
                                <option value="Gateman">Gateman</option>
                                <option value="Sub Staff">Sub Staff</option>
                                <option value="Rows">Rows</option>
                                <option value="Gate">Gate</option>
                                <option value="Double House">Double House</option>
                                <option value="Row House">Row House</option>
                                <option value="Bungalow">Bungalow</option>
                                <option value="Row(Wa.Di)">Row(Wa.Di)</option>
                                <option value="Shared">Shared</option>
                                <option value="regular">regular</option>
                                <option value="Room">Room</option>
                                <option value="Fields">Fields</option>
                            </select>
                        </td>
                        <td><input type="text" class="editable-input text-left" value="No. 12, Railway Avenue, Colombo 10" readonly></td>
                        <td><input type="text" class="editable-input" value="Newly renovated" readonly></td>
                        <td><button class="action-btn btn-form" onclick="openForm('Q-01')">Form</button></td>
                        <td>
                            <select class="dropdown-select" disabled>
                                <option value="Occupied" selected>Occupied</option>
                                <option value="Vacant">Vacant</option>
                                <option value="Under Maintenance">Under Maintenance</option>
                            </select>
                        </td>
                        <td><input type="text" class="editable-input" value="CMP-103" readonly></td>
                        <td><button class="action-btn btn-view" onclick="viewOldBooking('Q-01')">View</button></td>
                        <td>
                            <button class="action-btn btn-edit" onclick="enableEdit(this)">Edit</button>
                            <button class="action-btn btn-save" onclick="saveRow(this)">Save</button>
                            <button class="action-btn btn-delete" onclick="deleteRow(this)">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function addNewQuarterRow() {
            const tbody = document.getElementById('quartersBody');
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td>New</td>
                <td><input type="text" class="editable-input" value="Q-0X"></td>
                <td><input type="text" class="editable-input" value="00"></td>
                <td>
                    <select class="dropdown-select">
                        <option value="Bungalows">Bungalows</option>
                        <option value="Field">Field</option>
                        <option value="Single">Single</option>
                        <option value="Couple">Couple</option>
                        <option value="Row">Row</option>
                        <option value="Line">Line</option>
                        <option value="Flats">Flats</option>
                        <option value="Double">Double</option>
                        <option value="Flat">Flat</option>
                        <option value="Twin">Twin</option>
                        <option value="Gateman">Gateman</option>
                        <option value="Sub Staff">Sub Staff</option>
                        <option value="Rows">Rows</option>
                        <option value="Gate">Gate</option>
                        <option value="Double House">Double House</option>
                        <option value="Row House">Row House</option>
                        <option value="Bungalow">Bungalow</option>
                        <option value="Row(Wa.Di)">Row(Wa.Di)</option>
                        <option value="Shared">Shared</option>
                        <option value="regular">regular</option>
                        <option value="Room">Room</option>
                        <option value="Fields">Fields</option>
                    </select>
                </td>
                <td><input type="text" class="editable-input text-left" value="Enter Address"></td>
                <td><input type="text" class="editable-input" value="None"></td>
                <td><button class="action-btn btn-form" onclick="openForm('New')">Form</button></td>
                <td>
                    <select class="dropdown-select">
                        <option value="Vacant">Vacant</option>
                        <option value="Occupied">Occupied</option>
                        <option value="Under Maintenance">Under Maintenance</option>
                    </select>
                </td>
                <td><input type="text" class="editable-input" value="--"></td>
                <td><button class="action-btn btn-view" onclick="viewOldBooking('New')">View</button></td>
                <td>
                    <button class="action-btn btn-edit" style="display:none;" onclick="enableEdit(this)">Edit</button>
                    <button class="action-btn btn-save" style="display:inline-block;" onclick="saveRow(this)">Save</button>
                    <button class="action-btn btn-delete" onclick="deleteRow(this)">Delete</button>
                </td>
            `;
            tbody.appendChild(newRow);
        }

        function enableEdit(button) {
            const row = button.closest('tr');
            row.querySelectorAll('.editable-input').forEach(input => input.removeAttribute('readonly'));
            row.querySelectorAll('.dropdown-select').forEach(select => select.removeAttribute('disabled'));
            row.querySelector('.btn-edit').style.display = 'none';
            row.querySelector('.btn-save').style.display = 'inline-block';
        }

        function saveRow(button) {
            const row = button.closest('tr');
            row.querySelectorAll('.editable-input').forEach(input => input.setAttribute('readonly', true));
            row.querySelectorAll('.dropdown-select').forEach(select => select.setAttribute('disabled', true));
            row.querySelector('.btn-save').style.display = 'none';
            row.querySelector('.btn-edit').style.display = 'inline-block';
            alert("Quarters details saved successfully to database!");
        }

        function deleteRow(button) {
            if (confirm("Are you sure you want to delete this quarter record?")) {
                button.closest('tr').remove();
            }
        }

        function openForm(id) { alert("Opening Sub Department Form for: " + id); }
        function viewOldBooking(id) { alert("Viewing old booking history for: " + id); }
    </script>
</body>
</html>
