<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Applicant - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f4f4; }
        .form-wrapper { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .card { background: #ffffff; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-top: 5px solid #7A1C1C; }
        .card h2 { color: #222; font-size: 1.5rem; margin-bottom: 25px; text-transform: uppercase; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .card form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 0.95rem; }
        .form-group input { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; box-sizing: border-box; }
        .form-group input:focus { border-color: #7A1C1C; }
        .btn-save { width: 100%; padding: 12px; background-color: #7A1C1C; color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 15px; }
        .btn-save:hover { background-color: #5c1414; }
        .card form .btn-save { grid-column: 1 / -1; }

        @media (max-width: 640px) {
            .form-wrapper { margin: 24px auto; }
            .card { padding: 24px 20px; }
            .card form { grid-template-columns: 1fr; }
            .card form .btn-save { grid-column: auto; }
        }
    </style>
</head>
<body>

    <div class="form-wrapper">
        <a href="waiting-lists.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Waiting Lists</a>

        <div class="card">
            <h2>Edit Applicant Details</h2>
            
            <form onsubmit="updateApplicant(event)">
                <div class="form-group">
                    <label>NIC Number</label>
                    <input type="text" id="nic" value="199812345678" required>
                </div>

                <div class="form-group">
                    <label>Computer Number</label>
                    <input type="text" id="computerNo" value="101" inputmode="numeric" pattern="[0-9]+" title="Enter digits only" required>
                </div>

                <div class="form-group">
                    <label>Applicant's Name</label>
                    <input type="text" id="fullName" value="A. B. Perera" required>
                </div>

                <div class="form-group">
                    <label>Designation</label>
                    <input type="text" id="designation" value="Clerk" required>
                </div>

                <div class="form-group">
                    <label>Housing Type</label>
                    <input type="text" id="housingType" value="Grade II" required>
                </div>

                <div class="form-group">
                    <label>Workplace</label>
                    <input type="text" id="workplace" value="Colombo Fort" required>
                </div>

                <div class="form-group">
                    <label>Allocated Date</label>
                    <input type="date" id="allocatedDate" value="2026-01-10" required>
                </div>

                <div class="form-group">
                    <label>Allocated House Type</label>
                    <input type="text" id="allocatedHouseType" value="None" required>
                </div>

                <div class="form-group">
                    <label>Other</label>
                    <input type="text" id="other" value="None">
                </div>

                <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Update Applicant</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('computerNo').addEventListener('input', event => {
            event.target.value = event.target.value.replace(/\D/g, '');
        });

        function updateApplicant(event) {
            event.preventDefault();
            
            alert("Applicant details updated successfully!");
            window.location.href = "waiting-lists.html";
        }
    </script>

</body>
</html>
