<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarters Maintenance - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .page-title { text-align: center; color: #7A1C1C; font-size: 2rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 8px; }
        
        .section-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .search-box-wrapper { position: relative; display: flex; align-items: center; }
        .search-box-wrapper i { position: absolute; left: 14px; color: #64748b; font-size: 0.9rem; }
        .search-input { padding: 10px 14px 10px 40px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; width: 320px; outline: none; transition: all 0.2s; background-color: #ffffff; }
        .search-input:focus { border-color: #7A1C1C; box-shadow: 0 0 0 3px rgba(122, 28, 28, 0.1); }

        .table-card { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; overflow-x: auto; }
        .maint-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1100px; }
        .maint-table th, .maint-table td { padding: 12px 10px; border: 1px solid #cbd5e1; text-align: center; font-size: 0.9rem; vertical-align: middle; }
        .maint-table th { background-color: #f8fafc; color: #1e293b; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        .no-data { text-align: center; padding: 20px; color: #64748b; font-style: italic; }

        .action-cell { display: flex; justify-content: center; align-items: center; gap: 6px; }
        .action-btn { border: none; width: 32px; height: 32px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s; }
        .btn-view { background-color: #0ea5e9; color: white; }
        .btn-view:hover { background-color: #0284c7; }
        .btn-edit { background-color: #f59e0b; color: white; }
        .btn-edit:hover { background-color: #d97706; }
        .btn-delete { background-color: #dc2626; color: white; }
        .btn-delete:hover { background-color: #b91c1c; }

        .custom-msg-box { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .msg-content { background: white; padding: 25px; border-radius: 10px; text-align: center; width: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .msg-content p { margin-bottom: 20px; font-size: 1rem; color: #334155; font-weight: 600; }
        .msg-btns { display: flex; justify-content: center; gap: 10px; }
        .msg-btn { padding: 8px 15px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; }
        .msg-btn-yes { background-color: #dc2626; color: white; }
        .msg-btn-no { background-color: #64748b; color: white; }

        .view-modal-content { background: white; padding: 30px; border-radius: 12px; width: 500px; max-width: 90%; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .view-modal-content h3 { color: #7A1C1C; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .view-row { display: flex; margin-bottom: 10px; font-size: 0.9rem; }
        .view-label { font-weight: 700; width: 160px; color: #475569; }
        .view-value { color: #1e293b; flex: 1; }
        .close-view-btn { background-color: #7A1C1C; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 15px; display: block; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <a href="quarters-list.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Quarters List</a>
        <h2 class="page-title">Quarters Maintenance Details</h2>

        <div class="section-header-bar">
            <div class="search-box-wrapper">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by Quarter No or Name..." onkeyup="searchTable()">
            </div>
        </div>

        <div class="table-card">
            <table class="maint-table" id="maintTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Quarter No.</th>
                        <th>Quarter Name</th>
                        <th>Quarter Location</th>
                        <th>Quarter Type</th>
                        <th>Status</th>
                        <th>Last Maintenance Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="maintBody">
                    <!-- Dynamic Maintenance Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- View Details Modal -->
    <div class="custom-msg-box" id="viewModal">
        <div class="view-modal-content">
            <h3>Quarter Detailed View</h3>
            <div id="viewModalBody"></div>
            <button class="close-view-btn" onclick="closeViewModal()">Close</button>
        </div>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div class="custom-msg-box" id="deleteModal">
        <div class="msg-content">
            <p><i class="fa-solid fa-triangle-exclamation" style="color: #dc2626; font-size: 1.5rem; margin-bottom: 10px; display:block;"></i> Are you sure you want to delete this quarter record?</p>
            <div class="msg-btns">
                <button class="msg-btn msg-btn-yes" id="confirmDeleteBtn">Yes, Delete</button>
                <button class="msg-btn msg-btn-no" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const defaultData = [
            {
                quarterNum: "Q-01",
                quarterName: "Bungalow A",
                division: "Way & Works",
                ownership: "Railway Department",
                quarterArea: "Colombo Central",
                location: "Colombo",
                address: "No. 12, Railway Avenue, Colombo 10",
                quarterType: "Bungalows",
                assessmentRent: "5,500.00",
                status: "Under Maintenance",
                electric: true,
                water: true,
                lastMaint: "2025-05-12"
            },
            {
                quarterNum: "Q-02",
                quarterName: "Type II House",
                division: "Signal & Telecommunication",
                ownership: "Railway Department",
                quarterArea: "Kandy",
                location: "Kandy",
                address: "No. 8, Peradeniya Road, Kandy",
                quarterType: "Type II",
                assessmentRent: "4,200.00",
                status: "Available",
                electric: true,
                water: true,
                lastMaint: "2025-04-18"
            },
            {
                quarterNum: "Q-03",
                quarterName: "Staff Flat",
                division: "Electrical",
                ownership: "Railway Department",
                quarterArea: "Galle",
                location: "Galle",
                address: "No. 22, Fort Road, Galle",
                quarterType: "Type I",
                assessmentRent: "3,900.00",
                status: "Under Maintenance",
                electric: true,
                water: false,
                lastMaint: "2025-06-05"
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadMaintenanceData();
        });

        function getStoredData() {
            const data = localStorage.getItem('quartersData');
            let parsed = null;
            try {
                parsed = data ? JSON.parse(data) : null;
            } catch (e) {
                parsed = null;
            }

            if (!Array.isArray(parsed) || parsed.length === 0 || !parsed[0].quarterNum) {
                localStorage.setItem('quartersData', JSON.stringify(defaultData));
                return [...defaultData];
            }
            return parsed;
        }

        function loadMaintenanceData() {
            const tbody = document.getElementById('maintBody');
            tbody.innerHTML = '';
            
            let data = getStoredData();
            let maintData = [];
            
            // Flexible matching for maintenance status
            data.forEach((item, originalIndex) => {
                const status = (item.status || '').toLowerCase();
                if (status.includes('maintenance')) {
                    maintData.push({ ...item, originalIndex });
                }
            });

            // Fallback: If no records match "maintenance", let's force the first item to be "Under Maintenance" so data is visible immediately
            if (maintData.length === 0 && data.length > 0) {
                data[0].status = "Under Maintenance";
                localStorage.setItem('quartersData', JSON.stringify(data));
                maintData.push({ ...data[0], originalIndex: 0 });
            }

            if (maintData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="no-data">No quarters are currently under maintenance.</td></tr>`;
                return;
            }

            maintData.forEach((item, displayIndex) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${displayIndex + 1}</td>
                    <td><b>${item.quarterNum || '-'}</b></td>
                    <td>${item.quarterName || '-'}</td>
                    <td>${item.location || '-'}</td>
                    <td>${item.quarterType || '-'}</td>
                    <td><span style="background:#fef3c7; color:#d97706; padding:4px 8px; border-radius:12px; font-weight:600; font-size:0.75rem;">${item.status}</span></td>
                    <td><strong>${item.lastMaint || 'Not Recorded'}</strong></td>
                    <td>
                        <div class="action-cell">
                            <button class="action-btn btn-view" onclick="openViewModal(${item.originalIndex})" title="View Details"><i class="fa-solid fa-eye"></i></button>
                            <a href="edit-quarter.html?index=${item.originalIndex}" class="action-btn btn-edit" title="Edit"><i class="fa-solid fa-pen-to-square"></i></a>
                            <button class="action-btn btn-delete" onclick="promptDelete(${item.originalIndex})" title="Delete"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function searchTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const table = document.getElementById("maintTable");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                const tdQuarterNo = tr[i].getElementsByTagName("td")[1];
                const tdQuarterName = tr[i].getElementsByTagName("td")[2];
                
                let rowMatched = false;
                
                if (tdQuarterNo || tdQuarterName) {
                    const noText = tdQuarterNo ? (tdQuarterNo.textContent || tdQuarterNo.innerText).toLowerCase() : "";
                    const nameText = tdQuarterName ? (tdQuarterName.textContent || tdQuarterName.innerText).toLowerCase() : "";
                    
                    if (noText.indexOf(filter) > -1 || nameText.indexOf(filter) > -1) {
                        rowMatched = true;
                    }
                }

                tr[i].style.display = rowMatched ? "" : "none";
            }
        }

        function openViewModal(index) {
            const data = getStoredData();
            const item = data[index];
            if (!item) return;

            const modalBody = document.getElementById('viewModalBody');
            modalBody.innerHTML = `
                <div class="view-row"><div class="view-label">Quarter No:</div><div class="view-value">${item.quarterNum}</div></div>
                <div class="view-row"><div class="view-label">Quarter Name:</div><div class="view-value">${item.quarterName || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Division:</div><div class="view-value">${item.division || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Ownership:</div><div class="view-value">${item.ownership || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Quarter Area:</div><div class="view-value">${item.quarterArea || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Location:</div><div class="view-value">${item.location}</div></div>
                <div class="view-row"><div class="view-label">Address:</div><div class="view-value">${item.address || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Quarter Type:</div><div class="view-value">${item.quarterType}</div></div>
                <div class="view-row"><div class="view-label">Assessment Rent:</div><div class="view-value">Rs. ${item.assessmentRent || '0.00'}</div></div>
                <div class="view-row"><div class="view-label">Status:</div><div class="view-value">${item.status}</div></div>
                <div class="view-row"><div class="view-label">Last Maintenance:</div><div class="view-value">${item.lastMaint || 'Not Recorded'}</div></div>
            `;
            document.getElementById('viewModal').style.display = 'flex';
        }

        function closeViewModal() { document.getElementById('viewModal').style.display = 'none'; }

        let deleteTargetIndex = null;
        function promptDelete(index) {
            deleteTargetIndex = index;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            deleteTargetIndex = null;
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            if (deleteTargetIndex !== null) {
                const data = getStoredData();
                data.splice(deleteTargetIndex, 1);
                localStorage.setItem('quartersData', JSON.stringify(data));
                loadMaintenanceData();
                closeDeleteModal();
            }
        });
    </script>
</body>
</html>
