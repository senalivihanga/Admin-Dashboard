<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarters Details Table - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .table-container { max-width: 1200px; margin: 40px auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; }
        .page-title { color: #7A1C1C; margin-bottom: 25px; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 1.3rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
        
        .table-responsive { overflow-x: auto; }
        .quarters-table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 15px; }
        .quarters-table th, .quarters-table td { padding: 12px 10px; border: 1px solid #cbd5e1; font-size: 0.9rem; text-align: center; }
        .quarters-table th { background-color: #f8fafc; color: #1e293b; font-weight: 700; }
        
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin: 2px; }
        .badge-active { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-inactive { background-color: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

        .btn-container { display: flex; gap: 10px; margin-top: 25px; border-top: 2px solid #f1f5f9; padding-top: 20px; }
        .action-link-btn { flex: 1; text-align: center; padding: 12px; border-radius: 6px; font-weight: 600; text-decoration: none; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-dashboard { background-color: #64748b; }
        .btn-dashboard:hover { background-color: #475569; }
        .btn-maintain { background-color: #7A1C1C; }
        .btn-maintain:hover { background-color: #5c1515; }
    </style>
</head>
<body>

    <div class="table-container">
        <h2 class="page-title"><i class="fa-solid fa-building"></i> Quarters Details Table</h2>
        
        <div class="table-responsive">
            <table class="quarters-table">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Quarter No.</th>
                        <th>Quarter Location</th>
                        <th>Quarter Name</th>
                        <th>Address</th>
                        <th>Quarter Type</th>
                        <th>Assessment Rent (LKR)</th>
                        <th>Status</th>
                        <th>Facility (Electricity & Water)</th>
                    </tr>
                </thead>
                <tbody id="quartersTableBody">
                    <!-- Dynamic rows will load here -->
                </tbody>
            </table>
        </div>

        <div class="btn-container">
            <a href="BO.html" class="action-link-btn btn-dashboard"><i class="fa-solid fa-house"></i> Back to BO Dashboard</a>
            <a href="maintenance-BO.html" class="action-link-btn btn-maintain"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance Table</a>
        </div>
    </div>

    <script>
        // Initialize Dummy Data if LocalStorage is empty
        if (!localStorage.getItem('quartersData')) {
            const dummyQuarters = [
                {
                    quarterNum: "Q-01",
                    location: "Colombo",
                    quarterName: "Bungalow A",
                    address: "No. 12, Railway Avenue, Colombo 10",
                    quarterType: "Bungalows",
                    assessmentRent: "5500.00",
                    status: "Under Maintenance",
                    electric: true,
                    water: true
                },
                {
                    quarterNum: "Q-102",
                    location: "Maradana",
                    quarterName: "Yard Master Quarters",
                    address: "45, Technical Junction, Maradana",
                    quarterType: "Grade II",
                    assessmentRent: "10,000.00",
                    status: "Under Maintenance",
                    electric: true,
                    water: false
                }
            ];
            localStorage.setItem('quartersData', JSON.stringify(dummyQuarters));
        }

        window.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(localStorage.getItem('quartersData')) || [];
            const tbody = document.getElementById('quartersTableBody');
            
            if (data.length > 0) {
                tbody.innerHTML = '';
                data.forEach((item, index) => {
                    const electricBadge = item.electric 
                        ? `<span class="badge badge-active"><i class="fa-solid fa-bolt"></i> Elec</span>` 
                        : `<span class="badge badge-inactive"><i class="fa-solid fa-bolt"></i> Elec</span>`;
                    
                    const waterBadge = item.water 
                        ? `<span class="badge badge-active"><i class="fa-solid fa-droplet"></i> Water</span>` 
                        : `<span class="badge badge-inactive"><i class="fa-solid fa-droplet"></i> Water</span>`;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td><b>${item.quarterNum || '-'}</b></td>
                        <td>${item.location || '-'}</td>
                        <td>${item.quarterName || 'N/A'}</td>
                        <td>${item.address || 'N/A'}</td>
                        <td>${item.quarterType || '-'}</td>
                        <td><b>Rs. ${item.assessmentRent || '0.00'}</b></td>
                        <td>${item.status || '-'}</td>
                        <td>${electricBadge} ${waterBadge}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: #dc2626; font-weight: 600; padding: 20px;">No quarter records found!</td></tr>`;
            }
        });
    </script>
</body>
</html>
