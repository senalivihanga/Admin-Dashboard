<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Allocated Quarter - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        
        .page-title { text-align: center; color: #000000; font-size: 1.8rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        
        .form-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; }
        
        /* Two-column layout grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full-width { grid-column: span 2; }
        
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #1e293b; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
        .form-control:focus { border-color: #7A1C1C; }
        
        .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; grid-column: span 2; }
        .btn { padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 0.95rem; text-decoration: none; }
        
        .btn-submit { background-color:  #10b981; color: white; border: none; padding: 12px 200px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; grid-column: span 2; margin-top: 10px; }
        .btn-submit:hover { background-color:  #059669; }
    </style>
</head>
<body>

    <div class="container">
        <a href="allocated-quarters.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to List</a>

        <div class="form-card">
            <h2 class="page-title">Add New Allocation</h2>

            <form id="addForm" onsubmit="saveAllocation(event)" class="form-grid">
                <div class="form-group">
                    <label for="nic">NIC</label>
                    <input type="text" id="nic" class="form-control" required placeholder="Enter NIC number">
                </div>
                <div class="form-group">
                    <label for="computerNo">Computer No.</label>
                    <input type="text" id="computerNo" class="form-control" inputmode="numeric" pattern="[0-9]+" title="Enter digits only" required placeholder="Enter computer number">
                </div>
                <div class="form-group">
                    <label for="quarterNo">Quarter No.</label>
                    <input type="text" id="quarterNo" class="form-control" required placeholder="Enter quarter number">
                </div>
                <div class="form-group">
                    <label for="quarterName">Quarter Name</label>
                    <input type="text" id="quarterName" class="form-control" required placeholder="Enter quarter name">
                </div>
                <div class="form-group">
                    <label for="quarterLocation">Quarter Location</label>
                    <input type="text" id="quarterLocation" class="form-control" required placeholder="Enter quarter location">
                </div>
                <div class="form-group">
                    <label for="quarterType">Quarter Type</label>
                    <input type="text" id="quarterType" class="form-control" required placeholder="Enter quarter type">
                </div>
                <div class="form-group">
                    <label for="residentName">Resident Name</label>
                    <input type="text" id="residentName" class="form-control" required placeholder="Enter resident name">
                </div>
                <div class="form-group">
                    <label for="designation">Designation</label>
                    <input type="text" id="designation" class="form-control" required placeholder="Enter designation">
                </div>
                <div class="form-group">
                    <label for="workplace">Workplace</label>
                    <input type="text" id="workplace" class="form-control" required placeholder="Enter workplace">
                </div>
                <div class="form-group">
                    <label for="allocatedDate">Allocated Date</label>
                    <input type="date" id="allocatedDate" class="form-control" required>
                </div>
                <div class="form-group full-width">
                    <label for="other">Other</label>
                    <textarea id="other" class="form-control" rows="3" placeholder="Additional notes (optional)"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">Save Allocation</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('computerNo').addEventListener('input', event => {
            event.target.value = event.target.value.replace(/\D/g, '');
        });

        function saveAllocation(event) {
            event.preventDefault();
            
            const newItem = {
                nic: document.getElementById('nic').value,
                computerNo: document.getElementById('computerNo').value,
                quarterNo: document.getElementById('quarterNo').value,
                quarterName: document.getElementById('quarterName').value,
                quarterLocation: document.getElementById('quarterLocation').value,
                quarterType: document.getElementById('quarterType').value,
                residentName: document.getElementById('residentName').value,
                designation: document.getElementById('designation').value,
                workplace: document.getElementById('workplace').value,
                allocatedDate: document.getElementById('allocatedDate').value,
                other: document.getElementById('other').value || 'None'
            };

            const existingData = JSON.parse(localStorage.getItem('allocatedQuartersData')) || [];
            existingData.push(newItem);
            localStorage.setItem('allocatedQuartersData', JSON.stringify(existingData));

            window.location.href = 'allocated-quarters.html';
        }
    </script>
</body>
</html>
