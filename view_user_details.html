<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View User Details - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .view-container { max-width: 600px; margin: 40px auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; }
        .page-title { color: #7A1C1C; margin-bottom: 25px; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 1.5rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
        .view-row { display: flex; margin-bottom: 15px; font-size: 1rem; border-bottom: 1px solid #f8fafc; padding-bottom: 10px; }
        .view-label { font-weight: 700; width: 200px; color: #475569; }
        .view-value { color: #1e293b; flex: 1; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .badge-active { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .btn-container { display: flex; gap: 10px; margin-top: 25px; }
        .action-link-btn { flex: 1; text-align: center; padding: 10px; border-radius: 6px; font-weight: 600; text-decoration: none; color: white; }
        .btn-edit-link { background-color: #f59e0b; }
        .btn-edit-link:hover { background-color: #d97706; }
        .btn-back-link { background-color: #64748b; }
        .btn-back-link:hover { background-color: #475569; }
    </style>
</head>
<body>
    <div style="max-width: 600px; margin: 40px auto 0 auto; padding: 0 20px;">
        <a href="view_users.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to User List</a>
    </div>

    <div class="view-container">
        <h2 class="page-title"><i class="fa-solid fa-circle-info"></i> User Detailed View</h2>
        
        <div id="userDetailsBody">
            <!-- Dynamic data will load here -->
        </div>

        <div class="btn-container" id="actionButtonsContainer">
            <!-- Dynamic action buttons -->
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id') !== null ? urlParams.get('id') : urlParams.get('index');
        const nicParam = urlParams.get('nic');

        window.addEventListener('DOMContentLoaded', () => {
            const defaultUsers = [
                {
                    nic: "199812345678",
                    computerNo: "405",
                    fullName: "A. B. Perera",
                    email: "abperera@railway.gov.lk",
                    phone: "0771234567"
                },
                {
                    nic: "199287654321",
                    computerNo: "406",
                    fullName: "S. K. Silva",
                    email: "sksilva@railway.gov.lk",
                    phone: "0719876543"
                }
            ];

            let users = JSON.parse(localStorage.getItem('systemUsersList')) || JSON.parse(localStorage.getItem('usersData')) || defaultUsers;

            let userIndex = -1;
            let item = null;

            if (userId !== null && users[userId]) {
                userIndex = userId;
                item = users[userId];
            } else if (nicParam) {
                userIndex = users.findIndex(u => u.nic === nicParam);
                if (userIndex !== -1) {
                    item = users[userIndex];
                }
            } else if (users.length > 0) {
                userIndex = 0;
                item = users[0];
            }

            const container = document.getElementById('userDetailsBody');
            
            if (item) {
                const statusBadge = `<span class="badge badge-active"><i class="fa-solid fa-circle-check"></i> Active</span>`;

                container.innerHTML = `
                    <div class="view-row"><div class="view-label">Auto Index ID:</div><div class="view-value">${parseInt(userIndex) + 1}</div></div>
                    <div class="view-row"><div class="view-label">NIC Number:</div><div class="view-value"><b>${item.nic || 'N/A'}</b></div></div>
                    <div class="view-row"><div class="view-label">Computer Number:</div><div class="view-value">${item.computerNo || 'N/A'}</div></div>
                    <div class="view-row"><div class="view-label">Name:</div><div class="view-value">${item.fullName || item.name || 'N/A'}</div></div>
                    <div class="view-row"><div class="view-label">Email Address:</div><div class="view-value">${item.email || 'N/A'}</div></div>
                    <div class="view-row"><div class="view-label">Mobile Number:</div><div class="view-value">${item.phone || item.mobile || 'N/A'}</div></div>
                    <div class="view-row"><div class="view-label">Account Status:</div><div class="view-value">${statusBadge}</div></div>
                `;

                document.getElementById('actionButtonsContainer').innerHTML = `
                    <a href="edit_view_users.html?nic=${item.nic}" class="action-link-btn btn-edit-link"><i class="fa-solid fa-pen-to-square"></i> Edit Record</a>
                    <a href="view_users.html" class="action-link-btn btn-back-link"><i class="fa-solid fa-list"></i> Back to List</a>
                `;
            } else {
                container.innerHTML = `<p style="text-align: center; color: #dc2626; font-weight: 600;">Record not found or invalid ID!</p>`;
                document.getElementById('actionButtonsContainer').innerHTML = `<a href="view_users.html" class="action-link-btn btn-back-link" style="width: 100%;">Back to List</a>`;
            }
        });
    </script>
</body>
</html>
