<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View User Details - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .view-container { max-width: 600px; margin: 40px auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; }
        .page-title { color: #000; margin-bottom: 25px; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 1.5rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
        .details-table { width: 100%; border-collapse: collapse; }
        .details-table th, .details-table td { padding: 11px 8px; border-bottom: 1px solid #e2e8f0; text-align: left; vertical-align: middle; }
        .details-table th { color: #475569; width: 34%; }
        .details-table td { color: #1e293b; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .badge-active { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>
    <div style="max-width: 600px; margin: 40px auto 0 auto; padding: 0 20px;">
        <a href="view_users.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to User List</a>
    </div>

    <div class="view-container">
        <h2 class="page-title"><i class="fa-solid fa-circle-info"></i> User Detailed View</h2>
        
        <div id="userDetailsBody">
            <!-- Dynamic data will load here -->
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id') !== null ? urlParams.get('id') : urlParams.get('index');
        const nicParam = urlParams.get('nic');

        window.addEventListener('DOMContentLoaded', () => {
            const defaultUsers = [
                {
                    nic: "199812345678",
                    computerNo: "405",
                    fullName: "A. B. Perera",
                    email: "abperera@railway.gov.lk",
                    phone: "0771234567"
                },
                {
                    nic: "199287654321",
                    computerNo: "406",
                    fullName: "S. K. Silva",
                    email: "sksilva@railway.gov.lk",
                    phone: "0719876543"
                }
            ];

            let users = JSON.parse(localStorage.getItem('systemUsersList')) || JSON.parse(localStorage.getItem('usersData')) || defaultUsers;

            let userIndex = -1;
            let item = null;

            if (userId !== null && users[userId]) {
                userIndex = userId;
                item = users[userId];
            } else if (nicParam) {
                userIndex = users.findIndex(u => String(u.nic) === nicParam);
                if (userIndex !== -1) {
                    item = users[userIndex];
                } else {
                    const defaultIndex = defaultUsers.findIndex(user => user.nic === nicParam);
                    if (defaultIndex !== -1) {
                        item = { ...defaultUsers[defaultIndex] };
                        userIndex = users.length;
                        users.push(item);
                    }
                }
            } else if (users.length > 0) {
                userIndex = 0;
                item = users[0];
            }

            const container = document.getElementById('userDetailsBody');
            
            if (item) {
                const savedUsers = JSON.parse(localStorage.getItem('registeredUserEdits') || '{}');
                const savedUser = savedUsers[nicParam] || savedUsers[item.nic];
                if (savedUser) {
                    item = {
                        ...item,
                        nic: savedUser.nic || item.nic,
                        computerNo: savedUser.computerNo || item.computerNo,
                        fullName: savedUser.fullName || item.fullName || item.name,
                        email: savedUser.email || item.email,
                        phone: savedUser.phone || item.phone || item.mobile
                    };
                }

                const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[character]);
                const fields = [
                    { label: 'Auto Index ID', value: String(Number(userIndex) + 1) },
                    { label: 'NIC Number', value: item.nic || 'N/A' },
                    { label: 'Computer Number', value: item.computerNo || 'N/A' },
                    { label: 'Name', value: item.fullName || item.name || 'N/A' },
                    { label: 'Email Address', value: item.email || 'N/A' },
                    { label: 'Mobile Number', value: item.phone || item.mobile || 'N/A' },
                    { label: 'Account Status', value: 'Active' }
                ];

                container.innerHTML = `<table class="details-table"><tbody>${fields.map(field => `
                    <tr>
                        <th>${escapeHtml(field.label)}</th>
                        <td class="field-value">${field.label === 'Account Status' ? '<span class="badge badge-active"><i class="fa-solid fa-circle-check"></i> Active</span>' : escapeHtml(field.value)}</td>
                    </tr>`).join('')}</tbody></table>`;
            } else {
                container.innerHTML = `<p style="text-align: center; color: #dc2626; font-weight: 600;">Record not found or invalid ID!</p>`;
            }
        });
    </script>
</body>
</html>
