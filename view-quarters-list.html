<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarter Detailed View - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: #f1f5f4; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        .view-container { 
            max-width: 900px; 
            margin: 36px auto; 
            background: white; 
            padding: 30px 34px; 
            border-radius: 8px; 
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08); 
            border-top: 5px solid #7A1C1C; 
        }
        .page-title { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 11px; 
            color: #000000; 
            margin: 0 0 25px; 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            font-size: 1.5rem; 
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 15px;
        }
        .page-title i { 
            color: #000000; 
            font-size: 1.25rem; 
        }
        
        .details-grid { 
            display: grid; 
            grid-template-columns: repeat(2, minmax(0, 1fr)); 
            column-gap: 32px; 
            row-gap: 15px; 
        }
        .view-row { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            min-width: 0; 
            padding: 10px 0; 
            font-size: 1rem; 
            border-bottom: 1px solid #f1f5f9; 
        }
        .view-label { 
            color: #64748b; 
            font-size: 0.78rem; 
            font-weight: 700; 
            text-transform: uppercase; 
        }
        .view-value { 
            color: #17212b; 
            font-weight: 600; 
            overflow-wrap: anywhere; 
            font-size: 0.95rem;
        }
        
        .back-link { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            color: #7A1C1C; 
            text-decoration: none; 
            font-weight: 600; 
            margin-bottom: 18px; 
            padding: 8px 0; 
        }
        .back-link:hover { 
            color: #541313; 
        }
        
        .badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 5px; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 600; 
        }
        .badge-active { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-inactive { background-color: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

        @media (max-width: 600px) {
            .view-container { margin: 22px 14px; padding: 24px 20px; }
            .page-title { font-size: 1.35rem; }
            .details-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div style="max-width: 900px; margin: 36px auto 0; padding: 0 20px;">
        <a href="quarters-list.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Quarters List</a>
    </div>

    <div class="view-container">
        <h2 class="page-title"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> Quarter Detailed View</h2>
        
        <div class="details-grid" id="quarterDetailsGrid">
            <!-- Data will be loaded dynamically via JavaScript -->
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const index = urlParams.get('index');

        window.addEventListener('DOMContentLoaded', () => {
            loadQuarterDetails();
        });

        function loadQuarterDetails() {
            const data = JSON.parse(localStorage.getItem('quartersData')) || [];
            const gridContainer = document.getElementById('quarterDetailsGrid');

            if (index === null || !data[index]) {
                gridContainer.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #dc2626; font-weight: 600; padding: 20px;">Quarter details not found!</div>`;
                return;
            }

            const item = data[index];
            const electricStatus = item.electric ? `<span class="badge badge-active"><i class="fa-solid fa-bolt"></i> Available</span>` : `<span class="badge badge-inactive"><i class="fa-solid fa-bolt"></i> Not Available</span>`;
            const waterStatus = item.water ? `<span class="badge badge-active"><i class="fa-solid fa-droplet"></i> Available</span>` : `<span class="badge badge-inactive"><i class="fa-solid fa-droplet"></i> Not Available</span>`;

            gridContainer.innerHTML = `
                <div class="view-row">
                    <div class="view-label">Auto Index ID</div>
                    <div class="view-value">${parseInt(index) + 1}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Quarter Number</div>
                    <div class="view-value">${item.quarterNum || 'N/A'}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Quarter Name</div>
                    <div class="view-value">${item.quarterName || 'N/A'}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Quarter Division</div>
                    <div class="view-value">${item.division || 'N/A'}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Ownership</div>
                    <div class="view-value">${item.ownership || 'N/A'}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Quarter Area</div>
                    <div class="view-value">${item.quarterArea || 'N/A'}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Quarter Location</div>
                    <div class="view-value">${item.location || 'N/A'}</div>
                </div>
                <div class="view-row" style="grid-column: span 2;">
                    <div class="view-label">Address</div>
                    <div class="view-value">${item.address || 'N/A'}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Quarter Type</div>
                    <div class="view-value">${item.quarterType || 'N/A'}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Assessment Rent (LKR)</div>
                    <div class="view-value">Rs. ${item.assessmentRent || '0.00'}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Status</div>
                    <div class="view-value">${item.status || 'N/A'}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Last Maintenance Date</div>
                    <div class="view-value">${item.lastMaint || 'N/A'}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Electricity Facility</div>
                    <div class="view-value">${electricStatus}</div>
                </div>
                <div class="view-row">
                    <div class="view-label">Water Facility</div>
                    <div class="view-value">${waterStatus}</div>
                </div>
            `;
        }

        
    </script>
</body>
</html>
