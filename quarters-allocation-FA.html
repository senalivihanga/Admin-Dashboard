<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allocated Quarters List - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1650px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        
        .page-title { 
            text-align: center; 
            color: #7A1C1C; 
            font-size: 1.8rem; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            text-decoration: underline; 
            text-underline-offset: 6px; 
            font-weight: 700;
        }

        /* Search Bar Card Box */
        .search-card { 
            background: #ffffff; 
            padding: 20px 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
        }

        /* Table Card Box */
        .table-card { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            border-top: 5px solid #7A1C1C; 
            overflow-x: auto; 
            position: relative; 
        }

        .search-wrapper { display: flex; gap: 10px; align-items: center; }
        .search-input { padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; width: 300px; outline: none; }
        .search-input:focus { border-color: #7A1C1C; box-shadow: 0 0 0 3px rgba(122, 28, 28, 0.1); }
        
        .search-btn { background-color: #7A1C1C; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .search-btn:hover { background-color: #571a1a; }

        .allocated-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1400px; }
        .allocated-table th, .allocated-table td { padding: 12px 10px; border: 1px solid #cbd5e1; vertical-align: middle; font-size: 0.85rem; text-align: center; }
        .allocated-table th { background-color: #f8fafc; color: #1e293b; font-weight: 700; }
        .allocated-table td { color: #334155; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>

        <h2 class="page-title">Allocated Quarters List</h2>

        <!-- Separate Search Card Box -->
        <div class="search-card">
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by NIC, Computer No. or Quarter No..." oninput="if (this.value.trim() === '') searchTable()">
                <button class="search-btn" onclick="searchTable()"><i class="fa-solid fa-search"></i> Search</button>
            </div>
        </div>

        <!-- Separate Table Card Box -->
        <div class="table-card">
            <table class="allocated-table" id="allocatedTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>NIC</th>
                        <th>Computer No.</th>
                        <th>Quarter No.</th>
                        <th>Quarter Name</th>
                        <th>Quarter Location</th>
                        <th>Quarter Type</th>
                        <th>Resident Name</th>
                        <th>Designation</th>
                        <th>Workplace</th>
                        <th>Allocated Date</th>
                        <th>Other</th>
                    </tr>
                </thead>
                <tbody id="allocatedBody">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const defaultAllocatedData = [
            {
                nic: "199812345678",
                computerNo: "101",
                quarterNo: "Q-01",
                quarterName: "Sunflower Manor",
                quarterLocation: "Colombo 10",
                quarterType: "Grade II",
                residentName: "A. B. Perera",
                designation: "Clerk",
                workplace: "Colombo Fort",
                allocatedDate: "2026-01-10",
                other: "None"
            },
            {
                nic: "199912345678",
                computerNo: "102",
                quarterNo: "Q-04",
                quarterName: "Railway View",
                quarterLocation: "Maradana",
                quarterType: "Grade III",
                residentName: "N. K. Silva",
                designation: "Station Master",
                workplace: "Maradana",
                allocatedDate: "2026-02-15",
                other: "Sample record"
            }
        ];

        window.addEventListener('DOMContentLoaded', () => { loadTableData(); });

        function getStoredData() {
            const data = localStorage.getItem('allocatedQuartersData');
            const storedData = data ? JSON.parse(data) : [];

            const mergedData = [...defaultAllocatedData];
            storedData.forEach(item => {
                const isDuplicate = mergedData.some(existing =>
                    existing.nic === item.nic && existing.computerNo === item.computerNo
                );
                if (!isDuplicate) {
                    mergedData.push(item);
                }
            });

            return mergedData;
        }

        function loadTableData() {
            const tbody = document.getElementById('allocatedBody');
            tbody.innerHTML = '';
            const data = getStoredData();

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.nic}</td>
                    <td>${item.computerNo}</td>
                    <td>${item.quarterNo || '-'}</td>
                    <td>${item.quarterName || '-'}</td>
                    <td>${item.quarterLocation || '-'}</td>
                    <td>${item.quarterType}</td>
                    <td>${item.residentName}</td>
                    <td>${item.designation}</td>
                    <td>${item.workplace}</td>
                    <td>${item.allocatedDate}</td>
                    <td>${item.other || 'None'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function searchTable() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const tbody = document.getElementById("allocatedBody");
            const trs = tbody.getElementsByTagName("tr");

            for (let i = 0; i < trs.length; i++) {
                const nicTd = trs[i].getElementsByTagName("td")[1];
                const compNoTd = trs[i].getElementsByTagName("td")[2];
                const quarterNoTd = trs[i].getElementsByTagName("td")[3];

                if (nicTd || compNoTd || quarterNoTd) {
                    const nicText = nicTd ? nicTd.textContent.toLowerCase() : "";
                    const compText = compNoTd ? compNoTd.textContent.toLowerCase() : "";
                    const quarterNoText = quarterNoTd ? quarterNoTd.textContent.toLowerCase() : "";

                    if (nicText.includes(input) || compText.includes(input) || quarterNoText.includes(input)) {
                        trs[i].style.display = "";
                    } else {
                        trs[i].style.display = "none";
                    }
                }
            }
        }
    </script>
</body>
</html>
