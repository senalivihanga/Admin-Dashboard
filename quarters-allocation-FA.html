<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allocated Quarters History - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1500px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .page-title { text-align: center; color: #7A1C1C; font-size: 2rem; margin-bottom: 35px; text-transform: uppercase; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 8px; }
        
        .section-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; margin-bottom: 40px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .section-title { color: #7A1C1C; font-size: 1.4rem; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 10px; }
        
        .table-responsive { overflow-x: auto; width: 100%; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1100px; }
        .data-table th, .data-table td { padding: 12px 10px; border: 1px solid #cbd5e1; vertical-align: middle; font-size: 0.85rem; text-align: center; }
        .data-table th { background-color: #f8fafc; color: #1e293b; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; }
        .data-table td { color: #334155; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Link back to the Dashboard Hub -->
        <a href="FA.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h2 class="page-title">Quarters Allocations Management Portal</h2>

        <!-- Tile: Allocated Quarters History -->
        <div class="section-card">
            <div class="card-header">
                <h3 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Allocated Quarters History</h3>
            </div>
            <div id="allocatedTile" class="table-responsive">
                <table class="data-table" id="allocatedTable">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>NIC</th>
                            <th>Computer No.</th>
                            <th>Quarter Type</th>
                            <th>Resident Name</th>
                            <th>Designation</th>
                            <th>Workplace</th>
                            <th>Allocated Date</th>
                            <th>Other</th>
                        </tr>
                    </thead>
                    <tbody id="allocatedBody">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const defaultAllocatedData = [
            {
                nic: "199812345678",
                computerNo: "CMP-101",
                quarterType: "Grade II",
                residentName: "A. B. Perera",
                designation: "Clerk",
                workplace: "Colombo Fort",
                allocatedDate: "2026-01-10",
                other: "None"
            }
        ];

        window.addEventListener('DOMContentLoaded', () => { 
            loadAllocatedTable(); 
        });

        function loadAllocatedTable() {
            const tbody = document.getElementById('allocatedBody');
            tbody.innerHTML = '';
            const data = localStorage.getItem('allocatedQuartersData') ? JSON.parse(localStorage.getItem('allocatedQuartersData')) : defaultAllocatedData;

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.nic}</td>
                    <td><b>${item.computerNo}</b></td>
                    <td>${item.quarterType}</td>
                    <td>${item.residentName}</td>
                    <td>${item.designation}</td>
                    <td>${item.workplace}</td>
                    <td>${item.allocatedDate}</td>
                    <td>${item.other || 'None'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
