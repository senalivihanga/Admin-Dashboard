<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Maintenance Quarter - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .view-container { max-width: 700px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; }
        .view-container h2 { color: #7A1C1C; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .view-row { display: flex; margin-bottom: 12px; font-size: 0.95rem; border-bottom: 1px solid #f8fafc; padding-bottom: 8px; }
        .view-label { font-weight: 700; width: 200px; color: #475569; }
        .view-value { color: #1e293b; flex: 1; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div style="max-width: 700px; margin: 40px auto 0 auto; padding: 0 20px;">
        <a href="maintenance.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Maintenance List</a>
    </div>

    <div class="view-container">
        <h2>Maintenance Quarter Details</h2>
        <div id="viewDetailsContent">
            <!-- Dynamic Data -->
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const indexParam = urlParams.get('index');

        window.addEventListener('DOMContentLoaded', () => {
            if (indexParam === null || !/^\d+$/.test(indexParam)) {
                alert("Invalid record Index!");
                window.location.href = "maintenance_2.html";
                return;
            }

            const index = parseInt(indexParam, 10);
            const data = JSON.parse(localStorage.getItem('quartersData')) || [];
            const item = data[index];

            if (!item) {
                alert("Record not found!");
                window.location.href = "maintenance_2.html";
                return;
            }

            const content = document.getElementById('viewDetailsContent');
            content.innerHTML = `
                <div class="view-row"><div class="view-label">Quarter No:</div><div class="view-value">${item.quarterNum || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Quarter Name:</div><div class="view-value">${item.quarterName || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Quarter Location:</div><div class="view-value">${item.location || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Quarter Division:</div><div class="view-value">${item.division || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Ownership:</div><div class="view-value">${item.ownership || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Quarter Area:</div><div class="view-value">${item.quarterArea || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Address:</div><div class="view-value">${item.address || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Quarter Type:</div><div class="view-value">${item.quarterType || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Assessment Rent:</div><div class="view-value">Rs. ${item.assessmentRent || '0.00'}</div></div>
                <div class="view-row"><div class="view-label">Status:</div><div class="view-value">${item.status || 'N/A'}</div></div>
                <div class="view-row"><div class="view-label">Last Maintenance Date:</div><div class="view-value">${item.lastMaint || 'Not Recorded'}</div></div>
                <div class="view-row"><div class="view-label">Facilities:</div><div class="view-value">${item.electric ? 'Electricity ' : ''}${item.water ? ', Water' : ''}</div></div>
            `;
        });
    </script>
</body>
</html>
