<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User Details - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f4f4; }
        .form-wrapper { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .card { background: #ffffff; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-top: 5px solid #7A1C1C; }
        .card h2 { color: #222; font-size: 1.6rem; margin-bottom: 25px; text-transform: uppercase; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 0.95rem; }
        .form-group input { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; box-sizing: border-box; }
        .form-group input:focus { border-color: #7A1C1C; }
        .btn-save { width: 100%; padding: 12px; background-color: #7A1C1C; color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 15px; }
        .btn-save:hover { background-color: #5c1414; }
    </style>
</head>
<body>

    <div class="form-wrapper">
        <a href="view_users.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to User List</a>

        <div class="card">
            <h2>Edit User Information</h2>
            
            <form onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label>NIC Number</label>
                    <input type="text" name="nic" value="199812345678" required>
                </div>

                <div class="form-group">
                    <label>Computer Number</label>
                    <input type="text" id="computerNumberInput" name="computer_no" inputmode="numeric" pattern="[0-9]+" title="Enter digits only" value="405" required>
                </div>

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" value="A. B. Perera" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" value="abperera@railway.gov.lk" required>
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" name="mobile" value="0771234567" required>
                </div>

                <div class="form-group">
                    <label>New Password </label>
                    <input type="password" id="password" name="password" placeholder="Enter new password if changing">
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirm_password" placeholder="Re-enter new password">
                </div>

                <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Save & Return to List</button>
            </form>
        </div>
    </div>

    <script>
        const originalNic = new URLSearchParams(window.location.search).get('nic') || '199812345678';
        const defaultUsers = {
            '199812345678': { nic: '199812345678', computerNo: '405', fullName: 'A. B. Perera', email: 'abperera@railway.gov.lk', phone: '0771234567' },
            '199287654321': { nic: '199287654321', computerNo: '406', fullName: 'S. K. Silva', email: 'sksilva@railway.gov.lk', phone: '0719876543' }
        };
        const savedUsers = JSON.parse(localStorage.getItem('registeredUserEdits') || '{}');
        const selectedUser = savedUsers[originalNic] || defaultUsers[originalNic];
        if (selectedUser) {
            const form = document.querySelector('form');
            form.elements.namedItem('nic').value = selectedUser.nic;
            form.elements.namedItem('computer_no').value = selectedUser.computerNo;
            form.elements.namedItem('name').value = selectedUser.fullName;
            form.elements.namedItem('email').value = selectedUser.email;
            form.elements.namedItem('mobile').value = selectedUser.phone;
        }

        document.getElementById('computerNumberInput').addEventListener('input', event => {
            event.target.value = event.target.value.replace(/\D/g, '');
        });

        function handleFormSubmit(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== "" && password !== confirmPassword) {
                alert("Passwords do not match! Please check again.");
                document.getElementById('confirmPassword').focus();
                return;
            }

            const form = event.currentTarget;
            const users = JSON.parse(localStorage.getItem('registeredUserEdits') || '{}');
            users[originalNic] = {
                nic: form.elements.namedItem('nic').value.trim(),
                computerNo: form.elements.namedItem('computer_no').value.trim(),
                fullName: form.elements.namedItem('name').value.trim(),
                email: form.elements.namedItem('email').value.trim(),
                phone: form.elements.namedItem('mobile').value.trim()
            };
            localStorage.setItem('registeredUserEdits', JSON.stringify(users));
            alert("User details updated successfully!");
            window.location.href = "view_users.html";
        }
    </script>

</body>
</html>
