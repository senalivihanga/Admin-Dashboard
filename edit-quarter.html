<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quarter - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        .checkbox-group { display: flex; gap: 20px; margin-top: 10px; }
        .checkbox-group label { font-weight: normal; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .btn-submit { background-color: #f59e0b; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .btn-submit:hover { background-color: #d97706; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div style="max-width: 600px; margin: 40px auto 0 auto; padding: 0 20px;">
        <a href="quarters-list.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Quarters List</a>
    </div>

    <div class="form-container">
        <h2 style="color: #7A1C1C; margin-bottom: 20px; text-align: center;">Edit Quarter Record</h2>
        <form id="editQuarterForm">
            <div class="form-group">
                <label for="editQuarterNum">Quarter No.</label>
                <input type="text" id="editQuarterNum" required>
            </div>
            <div class="form-group">
                <label for="editLocation">Quarter Location</label>
                <input type="text" id="editLocation" required>
            </div>
            <div class="form-group">
                <label for="editQuarterName">Quarter Name</label>
                <input type="text" id="editQuarterName">
            </div>
            <div class="form-group">
                <label for="editAddress">Address</label>
                <input type="text" id="editAddress">
            </div>
            <div class="form-group">
                <label for="editQuarterType">Quarter Type</label>
                <select id="editQuarterType" required>
                    <option value="Bungalows">Bungalows</option>
                    <option value="Type I">Type I</option>
                    <option value="Type II">Type II</option>
                    <option value="Type III">Type III</option>
                </select>
            </div>
            <div class="form-group">
                <label for="editAssessmentRent">Assessment Rent (LKR)</label>
                <input type="number" id="editAssessmentRent" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="editStatus">Status</label>
                <select id="editStatus" required>
                    <option value="Available">Available</option>
                    <option value="Occupied">Occupied</option>
                    <option value="Under Maintenance">Under Maintenance</option>
                </select>
            </div>
            <div class="form-group">
                <label>Facilities</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="editElectric"> Electricity</label>
                    <label><input type="checkbox" id="editWater"> Water</label>
                </div>
            </div>
            <button type="submit" class="btn-submit">Update Changes</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const quarterId = urlParams.get('id');

        window.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(localStorage.getItem('quartersData')) || [];
            if (quarterId !== null && data[quarterId]) {
                const item = data[quarterId];
                document.getElementById('editQuarterNum').value = item.quarterNum || '';
                document.getElementById('editLocation').value = item.location || '';
                document.getElementById('editQuarterName').value = item.quarterName || '';
                document.getElementById('editAddress').value = item.address || '';
                document.getElementById('editQuarterType').value = item.quarterType || 'Bungalows';
                document.getElementById('editAssessmentRent').value = item.assessmentRent || '';
                document.getElementById('editStatus').value = item.status || 'Available';
                document.getElementById('editElectric').checked = !!item.electric;
                document.getElementById('editWater').checked = !!item.water;
            } else {
                alert('Invalid record ID!');
                window.location.href = 'quarters-list.html';
            }
        });

        document.getElementById('editQuarterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = JSON.parse(localStorage.getItem('quartersData')) || [];
            
            if (quarterId !== null && data[quarterId]) {
                data[quarterId] = {
                    quarterNum: document.getElementById('editQuarterNum').value,
                    location: document.getElementById('editLocation').value,
                    quarterName: document.getElementById('editQuarterName').value,
                    address: document.getElementById('editAddress').value,
                    quarterType: document.getElementById('editQuarterType').value,
                    assessmentRent: document.getElementById('editAssessmentRent').value,
                    status: document.getElementById('editStatus').value,
                    electric: document.getElementById('editElectric').checked,
                    water: document.getElementById('editWater').checked
                };

                localStorage.setItem('quartersData', JSON.stringify(data));
                window.location.href = 'quarters-list.html';
            }
        });
    </script>
</body>
</html>
