<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarters List - Sri Lanka Railways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1500px; margin: 40px auto; padding: 0 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 20px; }
        .page-title { text-align: center; color: #7A1C1C; font-size: 2rem; margin-bottom: 35px; text-transform: uppercase; letter-spacing: 1px; text-decoration: underline; text-underline-offset: 8px; }
        
        .section-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-top: 5px solid #7A1C1C; margin-bottom: 40px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .section-title { color: #7A1C1C; font-size: 1.4rem; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 10px; }
        
        .print-btn { background-color: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; font-size: 0.9rem; }
        .print-btn:hover { background-color: #02689c; }
        
        .table-responsive { overflow-x: auto; width: 100%; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 1100px; }
        .data-table th, .data-table td { padding: 12px 10px; border: 1px solid #cbd5e1; vertical-align: middle; font-size: 0.85rem; text-align: center; }
        .data-table th { background-color: #f8fafc; color: #1e293b; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; }
        .data-table td { color: #334155; }
        
        .facility-container { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; align-items: center; }
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-active { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-inactive { background-color: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

        /* A4 Landscape Print Configuration to fit all columns nicely */
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }
            body {
                background: #ffffff;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .back-link, .print-btn {
                display: none !important;
            }
            .container {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .section-card {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin-bottom: 0 !important;
            }
            .data-table {
                min-width: 100% !important;
                width: 100% !important;
                font-size: 9pt !important;
            }
            .data-table th, .data-table td {
                padding: 8px 6px !important;
                border: 1px solid #94a3b8 !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Link back to the Dashboard Hub -->
        <a href="quarters-details-SC.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <h2 class="page-title">Quarters Management Portal</h2>

        <!-- Tile: Quarters List -->
        <div class="section-card">
            <div class="card-header">
                <h3 class="section-title"><i class="fa-solid fa-house-chimney"></i> Quarters List</h3>
                <button class="print-btn" onclick="printSection('quartersTile')"><i class="fa-solid fa-print"></i> Print Quarters List</button>
            </div>
            <div id="quartersTile" class="table-responsive">
                <table class="data-table" id="quartersTable">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Quarter No.</th>
                            <th>Location</th>
                            <th>Quarter Name</th>
                            <th>Address</th>
                            <th>Quarter Type</th>
                            <th>Assessment Rent (LKR)</th>
                            <th>Status</th>
                            <th>Facility (Electricity & Water)</th>
                        </tr>
                    </thead>
                    <tbody id="quartersBody">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const defaultQuartersData = [
            {
                quarterNum: "Q-01",
                location: "Colombo",
                quarterName: "Bungalow A",
                address: "No. 12, Railway Avenue, Colombo 10",
                quarterType: "Bungalows",
                assessmentRent: "5,500.00",
                status: "Under Maintenance",
                electric: true,
                water: true
            }
        ];

        window.addEventListener('DOMContentLoaded', () => { 
            loadQuartersTable(); 
        });

        function loadQuartersTable() {
            const tbody = document.getElementById('quartersBody');
            tbody.innerHTML = '';
            const data = localStorage.getItem('quartersData') ? JSON.parse(localStorage.getItem('quartersData')) : defaultQuartersData;

            data.forEach((item, index) => {
                const electricBadge = item.electric ? `<span class="badge badge-active"><i class="fa-solid fa-bolt"></i></span>` : `<span class="badge badge-inactive"><i class="fa-solid fa-bolt"></i></span>`;
                const waterBadge = item.water ? `<span class="badge badge-active"><i class="fa-solid fa-droplet"></i></span>` : `<span class="badge badge-inactive"><i class="fa-solid fa-droplet"></i></span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><b>${item.quarterNum}</b></td>
                    <td>${item.location}</td>
                    <td>${item.quarterName || 'N/A'}</td>
                    <td>${item.address || 'N/A'}</td>
                    <td>${item.quarterType}</td>
                    <td><b>Rs. ${item.assessmentRent || '0.00'}</b></td>
                    <td>${item.status}</td>
                    <td>
                        <div class="facility-container">
                            ${electricBadge} Elec
                            ${waterBadge} Water
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function printSection(sectionId) {
            const printContent = document.getElementById(sectionId).innerHTML;
            const originalBody = document.body.innerHTML;

            document.body.innerHTML = `
                <div style="padding: 10px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                    <h2 style="text-align: center; color: #7A1C1C; text-transform: uppercase; margin-bottom: 2px; font-size: 18px;">Sri Lanka Railways</h2>
                    <h4 style="text-align: center; color: #475569; text-transform: uppercase; margin-bottom: 15px; font-weight: 600; font-size: 13px;">Quarters List Report</h4>
                    <div style="width: 100%;">
                        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 9pt;">
                            ${printContent}
                        </table>
                    </div>
                </div>
            `;

            window.print();
            document.body.innerHTML = originalBody;
            window.location.reload();
        }
    </script>
</body>
</html>
