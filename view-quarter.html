<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Quarter Allocation - Sri Lanka Railways Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        .view-container { max-width: 900px; margin: 36px auto; background: white; padding: 30px 34px; border-radius: 8px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08); border-top: 5px solid #7A1C1C; }
        .page-title { display: flex; align-items: center; justify-content: center; gap: 11px; color: #000000; margin: 0 0 25px; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; font-size: 1.65rem; }
        .page-title i { color: #7A1C1C; font-size: 1.35rem; }
        
        .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; row-gap: 15px; }
        .view-row { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px 0; font-size: 1rem; border-bottom: 1px solid #e5e7eb; }
        .view-label { color: #64748b; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; }
        .view-value { color: #17212b; font-weight: 600; overflow-wrap: anywhere; }
        
        .view-value input, .view-value select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; font-family: inherit; outline: none; background: #fff; box-sizing: border-box; }
        .view-value input:focus, .view-value select:focus { border-color: #7A1C1C; box-shadow: 0 0 0 2px rgba(122, 28, 28, 0.1); }
        
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #7A1C1C; text-decoration: none; font-weight: 600; margin-bottom: 18px; padding: 8px 0; }
        .back-link:hover { color: #541313; }
        
        .btn-container { display: flex; gap: 10px; margin-top: 25px; }
        .action-link-btn { flex: 1; text-align: center; padding: 12px; border-radius: 6px; font-weight: 600; text-decoration: none; color: white; border: none; cursor: pointer; font-size: 1rem; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-edit-link { background-color: #059669; }
        .btn-edit-link:hover { background-color: #047857; }
        .btn-back-link { background-color: #64748b; }
        .btn-back-link:hover { background-color: #475569; }

        @media (max-width: 600px) {
            .view-container { margin: 22px 14px; padding: 24px 20px; }
            .page-title { font-size: 1.35rem; }
            .details-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div style="max-width: 900px; margin: 36px auto 0; padding: 0 20px;">
        <a href="FA.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to FA Dashboard</a>
    </div>

    <div class="view-container">
        <h2 class="page-title"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> Direct Quarter Allocation</h2>
        
        <form id="directAllocationForm">
            <div class="details-grid">
                <div class="view-row">
                    <div class="view-label">NIC Number:</div>
                    <div class="view-value"><input type="text" id="nic" required placeholder="Enter NIC number"></div>
                </div>
                <div class="view-row">
                    <div class="view-label">Computer Number:</div>
                    <div class="view-value"><input type="text" id="computerNo" required placeholder="Enter computer number"></div>
                </div>
                <div class="view-row" style="grid-column: span 2;">
                    <div class="view-label">Full Name:</div>
                    <div class="view-value"><input type="text" id="fullName" required placeholder="Enter full name"></div>
                </div>
                <div class="view-row">
                    <div class="view-label">Email Address:</div>
                    <div class="view-value"><input type="email" id="email" required placeholder="Enter email address"></div>
                </div>
                <div class="view-row">
                    <div class="view-label">Mobile Number:</div>
                    <div class="view-value"><input type="text" id="phone" required placeholder="Enter mobile number"></div>
                </div>
                <div class="view-row">
                    <div class="view-label">Select Quarter:</div>
                    <div class="view-value">
                        <select id="quarterSelect" required>
                            <option value="">-- Select Available Quarter --</option>
                            <option value="Q-101 (Colombo Fort)">Q-101 (Colombo Fort)</option>
                            <option value="Q-102 (Maradana)">Q-102 (Maradana)</option>
                            <option value="Q-103 (Dematagoda)">Q-103 (Dematagoda)</option>
                        </select>
                    </div>
                </div>
                <div class="view-row">
                    <div class="view-label">Approval Reason:</div>
                    <div class="view-value"><input type="text" id="reason" required placeholder="e.g. Special Service Requirement"></div>
                </div>
            </div>

            <div class="btn-container">
                <button type="submit" class="action-link-btn btn-edit-link"><i class="fa-solid fa-check-circle"></i> Save & Allocate</button>
                <a href="FA.html" class="action-link-btn btn-back-link"><i class="fa-solid fa-arrow-left"></i> Cancel</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('directAllocationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const allocationData = {
                nic: document.getElementById('nic').value,
                computerNo: document.getElementById('computerNo').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                quarter: document.getElementById('quarterSelect').value,
                reason: document.getElementById('reason').value,
                status: "Directly Approved by FA",
                date: new Date().toISOString()
            };

            let existingAllocations = JSON.parse(localStorage.getItem('directAllocations')) || [];
            existingAllocations.push(allocationData);
            localStorage.setItem('directAllocations', JSON.stringify(existingAllocations));

            let systemUsers = JSON.parse(localStorage.getItem('systemUsersList')) || [];
            systemUsers.push(allocationData);
            localStorage.setItem('systemUsersList', JSON.stringify(systemUsers));

            alert("Direct quarter allocation saved and linked successfully!");
            window.location.href = "FA.html";
        });
    </script>
</body>
</html>
